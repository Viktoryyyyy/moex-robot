name: tests

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest python-dotenv pandas numpy pyarrow requests

      - name: Compile Python files
        run: |
          python -m compileall src tests

      - name: Run tests and capture output
        run: |
          set +e
          PYTHONPATH=.:src pytest -q > pytest-output.txt 2>&1
          code=$?
          echo "PYTEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          cat pytest-output.txt
          exit 0

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error

      - name: Upload diagnostic test sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-test-sources
          path: |
            tests/contract/test_route_b_github_executor_execution_path_target_workflow.py
            tests/contract/test_route_b_github_executor_intake_target_workflow.py
          if-no-files-found: error

      - name: Enforce pytest result
        run: |
          exit "$PYTEST_EXIT_CODE"
