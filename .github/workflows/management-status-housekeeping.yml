name: management-status-housekeeping

on:
  push:
    branches:
      - docs/management-status-housekeeping-20260729

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/management-status-housekeeping-20260729
          fetch-depth: 0

      - name: Update merged-source metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "docs/MOEX_BOT_MANAGEMENT_CANON.md",
              "docs/PM_L2_HANDOFF_PROMPT.md",
              "docs/FLOWISE_GITHUB_ORCHESTRATION.md",
              "docs/FLOWISE_LEAD_AGENT_PROMPT.md",
              "docs/FLOWISE_GITHUB_WORKER_PROMPT.md",
              "docs/BROWSER_PROJECT_CONTEXT.md",
              "docs/BROWSER_ROLE_CONTEXTS.md",
              "docs/MOEX_BOT_CONTEXT_CONFIGURATION_SOURCES.md",
              "docs/FLOWISE_AGENT_CONFIGURATION_GUIDE.md",
          ]

          old = "status: approved_pending_merge"
          new = "status: current_merged_source"

          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{filename}: expected exactly one '{old}', found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit metadata cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/MOEX_BOT_MANAGEMENT_CANON.md \
            docs/PM_L2_HANDOFF_PROMPT.md \
            docs/FLOWISE_GITHUB_ORCHESTRATION.md \
            docs/FLOWISE_LEAD_AGENT_PROMPT.md \
            docs/FLOWISE_GITHUB_WORKER_PROMPT.md \
            docs/BROWSER_PROJECT_CONTEXT.md \
            docs/BROWSER_ROLE_CONTEXTS.md \
            docs/MOEX_BOT_CONTEXT_CONFIGURATION_SOURCES.md \
            docs/FLOWISE_AGENT_CONFIGURATION_GUIDE.md
          if git diff --cached --quiet; then
            echo "No metadata changes required"
            exit 0
          fi
          git commit -m "docs: mark management sources current"
          git push origin HEAD:docs/management-status-housekeeping-20260729
