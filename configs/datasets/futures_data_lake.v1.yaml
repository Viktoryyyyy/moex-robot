config_id: futures_data_lake.v1
artifact_class: repo_relative
repo_path: configs/datasets/futures_data_lake.v1.yaml
architecture_contract_ref: contracts/architecture/moex_data_access_canon_v1.yaml
external_storage_root:
  artifact_id: moex_data_root
  artifact_class: env_contract
  env_var: MOEX_DATA_ROOT
  required: true
  hardcoded_server_path_allowed: false
storage_backend:
  primary: parquet_partitioned_lake
  query_layer: duckdb
dataset_contract_refs:
  - contracts/datasets/futures_raw_5m.v1.yaml
  - contracts/datasets/futures_futoi_raw.v1.yaml
  - contracts/datasets/futures_derived_d1.v1.yaml
  - contracts/datasets/futures_derived_w1.v1.yaml
  - contracts/datasets/futures_data_refresh_manifest.v1.yaml
  - contracts/datasets/futures_quality_report.v1.yaml
  - contracts/datasets/futures_continuous_5m.v1.yaml
artifact_class_index:
  futures_raw_5m.v1: external_pattern
  futures_futoi_raw.v1: external_pattern
  futures_derived_d1.v1: external_pattern
  futures_derived_w1.v1: external_pattern
  futures_data_refresh_manifest.v1: external_pattern
  futures_quality_report.v1: external_pattern
  futures_continuous_5m.v1: external_pattern
  moex_data_root: env_contract
  futures_data_lake.v1: repo_relative
supplementary_state_contract_refs:
  futoi_quality: contracts/datasets/futures_futoi_quality_report.v1.yaml
  futoi_refresh_manifest: contracts/datasets/futures_futoi_refresh_manifest.v1.yaml
source_contract_refs:
  quotes: contracts/sources/futures/moex_algopack_fo_tradestats_5m.v1.yaml
  futoi: contracts/sources/futures/moex_iss_futoi.v1.yaml
instrument_registry_ref:
  registry_id: forts_instrument_registry.v1
  repo_path: configs/instruments/forts_instrument_registry.v1.yaml
instrument_scope:
  stage2_instrument_ids:
    - usdrubf_futures_family
    - cnyrubf_futures_family
    - si_futures_family
    - cr_futures_family
  explicit_instrument_id_required: true
  explicit_source_id_required: true
  explicit_secid_required: true
  legacy_family_allowlist_allowed: false
  materialization_without_registry_entry_allowed: false
  default_granularity: 5m
  materialized_timeframes:
    - D1
    - W1
  on_demand_timeframes:
    - 15m
    - 30m
    - 1h
    - 4h
market_data_storage_policy:
  status: stage2_canonical_writers_introduced_pilot_pending
  canonical_new_write_root: "${MOEX_DATA_ROOT}/market"
  raw_quotes_contract_ref: contracts/datasets/futures_raw_5m.v1.yaml
  futoi_contract_ref: contracts/datasets/futures_futoi_raw.v1.yaml
  quotes_and_futoi_share_partition_file_allowed: false
  new_instrument_onboarding_to_legacy_roots_allowed: false
  new_dataset_creation_to_legacy_roots_allowed: false
  legacy_roots:
    - "${MOEX_DATA_ROOT}/forts"
    - "${MOEX_DATA_ROOT}/futures"
  legacy_root_status: compatibility_only_migration_required
  physical_data_migration_status: pending_separate_migration
stage2_forts_source_bindings:
  status: source_identity_bound_pilot_pending
  evidence_date: "2026-08-18"
  quote_source:
    source_id: moex_algopack_fo_tradestats_5m
    source_contract_ref: contracts/sources/futures/moex_algopack_fo_tradestats_5m.v1.yaml
    authentication_env: MOEX_API_KEY
    availability_status: proven
    proven_secids:
      - USDRUBF
      - CNYRUBF
      - SiU6
      - CRU6
  futoi_source:
    source_id: moex_iss_futoi
    source_contract_ref: contracts/sources/futures/moex_iss_futoi.v1.yaml
    availability_status: proven
    proven_tickers:
      - usdrubf
      - cnyrubf
      - si
      - cr
  readiness_flags:
    source_identity_ready: true
    quote_pilot_ready: true
    futoi_pilot_ready: true
    backfill_ready: false
    accepted_pointer_ready: false
    observed_source_refresh_ready: false
    scheduler_ready: false
    d1_materialization_ready: false
    research_ready: false
  forecast_anchor:
    local_anchor: "06:00 Europe/Moscow"
    timezone: UTC
  availability_policy:
    availability_ts_utc_required: true
    eligibility_rule: availability_ts_utc <= forecast_anchor_ts
    unknown_availability_ts_utc_rule: exclude_or_shift_by_at_least_one_trading_day
  explicit_non_authorizations:
    - no scheduler before observed-source refresh pass
    - no automatic Si or CR roll selection in Stage 2
    - no D1/W1 derivation before raw acceptance
    - no research enablement before accepted pointer
    - no server apply in Stage 2 change action
blocked_contracts:
  - futures_continuous_5m.v1
path_rules:
  external_root_source: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
