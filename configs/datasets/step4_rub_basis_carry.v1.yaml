config_id: step4_rub_basis_carry.v1
status: implementation_candidate_physical_pilot_pending
architecture_contract_ref: contracts/architecture/moex_data_access_canon_v1.yaml
purpose: >
  Canonical causal 5m basis, term-spread and market-implied carry features for
  USD/RUB and CNY/RUB using perpetual futures, expiring front/next futures and CETS TOM spot.

upstream_stage:
  required_stage: step3_canonical_raw
  required_status: raw_canonical_stage3_accepted
  config_ref: configs/datasets/step3_canonical_raw.v1.yaml

continuous_series_policy:
  production_dependency_required: false
  continuous_series_required_for_step4: false
  scope: optional_research_backtest_only
  contract_ref: contracts/datasets/futures_continuous_5m.v1.yaml
  runtime_enablement: false
  rationale: >
    USDRUBF and CNYRUBF provide the canonical perpetual market series for RUB analytics;
    Si/CR front+next are retained for basis, carry, term structure and OI rather than as
    mandatory stitched price histories.

pair_specs:
  usd_rub_basis_carry:
    pair_id: USD/RUB
    spot_instrument_id: usd_tom
    perpetual_instrument_id: usdrubf_futures_family
    perpetual_secid: USDRUBF
    front_instrument_id: si_front_contract
    next_instrument_id: si_next_contract
    front_next_root: Si
    expiring_price_divisor: 1000.0
    normalized_quote_unit: RUB_per_USD
    normalization_rationale: Si_is_quoted_in_RUB_per_1000_USD_lot
    official_reference_url: https://www.moex.com/a7235
  cny_rub_basis_carry:
    pair_id: CNY/RUB
    spot_instrument_id: cny_tom
    perpetual_instrument_id: cnyrubf_futures_family
    perpetual_secid: CNYRUBF
    front_instrument_id: cr_front_contract
    next_instrument_id: cr_next_contract
    front_next_root: CR
    expiring_price_divisor: 1.0
    normalized_quote_unit: RUB_per_CNY
    normalization_rationale: CR_is_quoted_in_RUB_per_1_CNY
    official_reference_url: https://www.moex.com/a3873

input_source_contract_refs:
  futures_quotes: contracts/sources/futures/moex_algopack_fo_tradestats_5m.v1.yaml
  front_next_reference: contracts/sources/futures/moex_iss_forts_securities_reference.v1.yaml
  front_next_mapping: contracts/sources/futures/roll_expiry_mapping.v1.yaml
  cets_tom: contracts/sources/currency/moex_iss_cets_tom_1m.v1.yaml

output_contract_ref: contracts/datasets/rub_basis_carry_5m.v1.yaml
acceptance_contract_ref: contracts/datasets/step4_rub_basis_carry_acceptance.v1.yaml
producer_refs:
  materializer: src/moex_data/analytics/materialize_rub_basis_carry_5m.py
  controlled_pilot: src/moex_data/step4_basis_carry_pilot_runner.py
  acceptance_promotion: src/moex_data/step4_basis_carry_acceptance.py

calculation_policy:
  timestamp_alignment: exact_5m_inner_join
  forward_fill_allowed: false
  backward_fill_allowed: false
  asof_join_allowed: false
  latest_autodetect_allowed: false
  explicit_trade_date_required: true
  explicit_as_of_date_required: true
  trade_date_must_equal_as_of_date_for_unversioned_front_next_reference: true
  front_next_selection_policy: nearest_two_contracts_with_last_trade_date_strictly_after_trade_date
  front_next_minimum_days_to_expiry: 1
  expiry_day_contract_allowed_for_annualized_carry: false
  annualization_basis_days: 365
  front_spot_implied_carry_formula: ((front_rate / spot_rate) - 1) * 365 / calendar_days_to_front_expiry
  next_spot_implied_carry_formula: ((next_rate / spot_rate) - 1) * 365 / calendar_days_to_next_expiry
  front_next_term_carry_formula: ((next_rate / front_rate) - 1) * 365 / calendar_days_between_expiries
  theoretical_fair_value_rate_model_in_scope: false
  foreign_interest_rate_input_required: false

physical_acceptance:
  expected_pair_count: 2
  expected_perpetual_quote_partition_count: 2
  expected_front_next_quote_partition_count: 4
  expected_tom_partition_count: 2
  expected_output_partition_count: 2
  expected_accepted_pointer_count: 2
  every_output_requires_nonzero_rows: true
  every_output_requires_quality_pass: true
  run_artifacts_immutable: true

readiness_flags:
  implementation_ready: true
  physical_pilot_passed: false
  accepted_pointer_ready: false
  scheduler_ready: false
  research_ready: false
