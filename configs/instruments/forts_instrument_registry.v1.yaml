registry_id: forts_instrument_registry.v1
schema_version: instrument_registry.v1
status: generic_registry_contract
activation_status: repo_only
scope_policy:
  explicit_instrument_id_required: true
  explicit_secid_required: true
  legacy_family_allowlist_allowed: false
  latest_autodetect_allowed: false
  implicit_contract_selection_allowed: false
  unresolved_instrument_blocks_materialization: true
instruments: []
rules:
  storage_partition_key: instrument_id
  secid_partition_key: secid
  family_partition_key_allowed: false
  default_family_allowlist_allowed: false
  materialization_without_registry_entry_allowed: false
  accepted_pointer_scope_strategy: per_instrument
  accepted_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/artifact_id={RAW_5M_ARTIFACT_ID}/instrument_id={INSTRUMENT_ID}/secid={SECID}/current_accepted_manifest.json"
  registry_entry_must_define:
    - instrument_id
    - canonical_symbol
    - display_name
    - market
    - board
    - secid
    - source_artifact_id
    - raw_5m_artifact_id
    - enabled_for_raw_5m_materialization
    - enabled_for_d1_derivation
    - enabled_for_research
    - storage_partition_values.instrument_id
    - storage_partition_values.secid
    - evidence_status
  raw_5m_onboarding_required_steps:
    - add_registry_entry
    - run_one_date_pilot_materialization
    - run_full_backfill
    - validate_manifest_and_quality
    - create_per_instrument_accepted_pointer
    - run_observed_source_refresh_check
    - enable_scheduler_only_after_refresh_check_passed
  onboarding_evidence_status_values:
    - pilot_required
    - pilot_passed
    - backfill_passed
    - accepted_pointer_created
    - observed_source_refresh_passed
    - scheduler_enabled
  production_scheduler_policy:
    required_incremental_mode: observed-source
    required_cli_argument: --incremental-mode observed-source
    calendar_mode_allowed_for_server_cron: false
