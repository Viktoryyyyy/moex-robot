adapter_id: route_b_pm_l2_console_actions_adapter.v0.1
source_schema_ref: route_b_pm_l2_console_actions.v0.1
project: MOEX Bot
scope: Route B PM L2 Console Actions Adapter
status: proposed
artifact_class: repo_relative
artifact_path: docs/sot/context/schemas/route_b_pm_l2_console_actions_adapter.v0.1.yaml
source_of_truth: github_repo
intended_consumer: PM_L2_CONSOLE
adapter_format: openapi_3_1
implementation_state: implementation_ready_not_production_wired

server_url_contract:
  class: env_contract
  name: N8N_PUBLIC_WEBHOOK_BASE_URL
  value_in_repo_allowed: false

auth_contract:
  class: env_contract
  secret_value_in_repo_allowed: false
  production_secret_wiring_in_scope: false

openapi_contract:
  openapi: 3.1.0
  info:
    title: MOEX Route B PM L2 Console Actions Adapter
    version: v0.1
  servers:
    - url: ${N8N_PUBLIC_WEBHOOK_BASE_URL}
      x-server-url-contract:
        class: env_contract
        name: N8N_PUBLIC_WEBHOOK_BASE_URL
        value_in_repo_allowed: false
  security:
    - routeBConsoleAuth: []
  components:
    securitySchemes:
      routeBConsoleAuth:
        type: http
        scheme: bearer
        x-auth-contract:
          class: env_contract
          secret_value_in_repo_allowed: false
          production_secret_wiring_in_scope: false
  paths:
    /moex/route-b/intake:
      post:
        operationId: submit_route_b_run
        x-maps-to-workflow: MOEX_ROUTE_B_INTAKE_ACK_V1_10_3
        x-authority-boundary:
          merge_authority_exposed_to_n8n: false
          ci_passed_is_pm_l2_approval: false
          runtime_live_trading_allowed: false
          broker_execution_allowed: false
          direct_main_write_allowed: false
          force_push_allowed: false
          file_delete_allowed: false
          executor_merge_allowed: false
        responses:
          "202":
            description: Route B run accepted and queued.
    /moex/route-b/status:
      get:
        operationId: get_route_b_status
        x-maps-to-workflow: MOEX_ROUTE_B_STATUS_QUERY_V1_10_3
        x-status-only: true
        x-authority-boundary:
          merge_authority_exposed_to_n8n: false
          ci_passed_is_pm_l2_approval: false
          runtime_live_trading_allowed: false
          broker_execution_allowed: false
          direct_main_write_allowed: false
          force_push_allowed: false
          file_delete_allowed: false
          executor_merge_allowed: false
        parameters:
          - name: workflow_run_id
            in: query
            required: false
            schema:
              type: string
          - name: idempotency_key
            in: query
            required: false
            schema:
              type: string
        responses:
          "200":
            description: Status-only Route B progress response.
    /moex/route-b/result:
      get:
        operationId: get_route_b_result
        x-maps-to-workflow: MOEX_ROUTE_B_RESULT_QUERY_V1_10_3
        x-status-only: false
        x-rejects-status-only-semantics: true
        x-status-only-redirect-action: get_route_b_status
        x-authority-boundary:
          merge_authority_exposed_to_n8n: false
          ci_passed_is_pm_l2_approval: false
          runtime_live_trading_allowed: false
          broker_execution_allowed: false
          direct_main_write_allowed: false
          force_push_allowed: false
          file_delete_allowed: false
          executor_merge_allowed: false
        parameters:
          - name: workflow_run_id
            in: query
            required: false
            schema:
              type: string
          - name: idempotency_key
            in: query
            required: false
            schema:
              type: string
          - name: repository_full_name
            in: query
            required: true
            schema:
              type: string
          - name: requested_by_role
            in: query
            required: true
            schema:
              type: string
              const: PM_L2_PHASE_OWNER
          - name: include_sections
            in: query
            required: false
            schema:
              type: string
        x-required-parameters:
          - repository_full_name
          - requested_by_role
        x-rejected-include-sections:
          - status
          - status_only
          - current_state
          - current_phase
          - metadata
          - identity
          - request
        responses:
          "200":
            description: Result evidence response for PM L2 review.
          "400":
            description: Invalid result request or status-only semantics rejected.
          "404":
            description: Route B run not found.

operations:
  - operation_id: submit_route_b_run
    method: POST
    path: /moex/route-b/intake
    maps_to_workflow: MOEX_ROUTE_B_INTAKE_ACK_V1_10_3
  - operation_id: get_route_b_status
    method: GET
    path: /moex/route-b/status
    maps_to_workflow: MOEX_ROUTE_B_STATUS_QUERY_V1_10_3
    status_only: true
  - operation_id: get_route_b_result
    method: GET
    path: /moex/route-b/result
    maps_to_workflow: MOEX_ROUTE_B_RESULT_QUERY_V1_10_3
    required_parameters:
      - repository_full_name
      - requested_by_role
    status_only: false
    rejects_status_only_semantics: true

invariants:
  exact_action_count: 3
  production_secrets_allowed: false
  server_first_assumptions_allowed: false
  workflow_json_relocation_allowed: false
  merge_authority_exposed_to_n8n: false
  ci_passed_is_pm_l2_approval: false
  runtime_live_trading_allowed: false
  broker_execution_allowed: false
  direct_main_write_allowed: false
  force_push_allowed: false
  file_delete_allowed: false
  executor_merge_allowed: false
