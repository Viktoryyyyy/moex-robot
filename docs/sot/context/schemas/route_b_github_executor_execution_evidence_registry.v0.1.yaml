schema_id: route_b_github_executor_execution_evidence_registry.v0.1
project: MOEX Bot
status: repo_side_contract
source_of_truth: github_repo
artifact_class: repo_relative
artifact_path: docs/sot/context/schemas/route_b_github_executor_execution_evidence_registry.v0.1.yaml
producer: SUBCHAT_IMPLEMENTATION
consumer: PM_L3_DELIVERY_VALIDATION_OWNER_or_ROUTE_B_GITHUB_EXECUTOR_CREDENTIALED_RUNTIME

scope_boundary:
  repo_only_contract: true
  db_migration_required: false
  server_db_mutation_allowed: false
  production_n8n_workflow_mutation_allowed: false
  endpoint_smoke_allowed: false
  runtime_live_broker_trading_scope_allowed: false
  secrets_or_auth_scope_allowed: false
  direct_main_write_allowed: false
  merge_allowed_by_this_registry: false
  server_apply_allowed: false
  production_secret_access_allowed: false

persistence_bindings:
  full_execution_evidence_registry:
    runtime_table: public.moex_n8n_workflow_run_events
    payload_column: event_payload_json
    table_role: append_only_execution_evidence_registry
    workflow_run_binding: workflow_run_id
    request_identity_lookup_fields:
      - execution_request_id
      - request_fingerprint_sha256
    payload_required_fields:
      - workflow_run_id
      - execution_request_id
      - role_task_id
      - base_sha
      - file_changes
      - request_fingerprint_sha256
    payload_optional_fields:
      - role_output_id
      - pm_l3_decision_id
    authority_fields_must_remain_explicit:
      - approved_for_merge
      - merge_performed
  current_state_projection_only:
    runtime_table: public.moex_n8n_workflow_runs
    projection_only: true
    forbidden_as_full_execution_evidence_registry: true
    allowed_usage:
      - current_status_projection
      - latest_projection_snapshot
  idempotency_checkpoint_only:
    runtime_table: public.moex_n8n_workflow_step_runs
    checkpoint_only: true
    forbidden_as_full_execution_evidence_registry: true
    allowed_usage:
      - resume_detection
      - duplicate_commit_prevention
      - duplicate_pr_prevention

request_identity_contract:
  required_fields:
    - execution_request_id
    - workflow_run_id
    - role_task_id
    - base_sha
    - file_changes
    - request_fingerprint_sha256
  optional_fields:
    - role_output_id
    - pm_l3_decision_id
  execution_request_id_fallback_to_task_id_allowed: false
  base_sha_must_reference_origin_main: true
  file_changes_must_be_exact_request_payload: true
  request_fingerprint_algorithm: sha256

idempotency_rules:
  same_execution_request_id_same_fingerprint: resume_or_return_existing_result
  same_execution_request_id_different_fingerprint: blocked
  duplicate_commit_creation: reuse_existing_commit_or_skip_new_commit
  duplicate_pr_creation: reuse_existing_pr_or_skip_new_pr
  branch_recreation_rule: reuse_existing_branch_when_checkpoint_exists
  request_identity_conflict_status: blocked
  deterministic_reuse_sources:
    - public.moex_n8n_workflow_run_events.event_payload_json
    - public.moex_n8n_workflow_step_runs
    - public.moex_n8n_workflow_runs

result_projection_contract:
  projection_table: public.moex_n8n_workflow_runs
  registry_table: public.moex_n8n_workflow_run_events
  result_fields:
    - execution_request_id
    - request_fingerprint_sha256
    - feature_branch
    - implementation_commit_sha
    - pr_number
    - pr_url
    - pr_head_sha
    - ci_workflow
    - ci_run_id
    - ci_conclusion
    - approved_for_merge
    - merge_performed
  projection_is_derived_state_only: true
  registry_is_source_of_truth_for_execution_evidence: true

authority_boundary:
  merge_authority: PM_L2_ONLY
  n8n_merge_allowed: false
  direct_main_write_allowed: false
  force_push_allowed: false
  file_delete_allowed: false
  executor_merge_allowed: false
  server_apply_allowed: false
  broker_execution_allowed: false
  live_trading_allowed: false
  runtime_allowed: false
  production_secret_access_allowed: false
  approved_for_merge_must_remain_false_until_pm_l2: true
  merge_performed_must_remain_false_until_pm_l2: true
