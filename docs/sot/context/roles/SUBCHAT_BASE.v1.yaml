status: active
mandate:
  - Execute exactly the assigned task package.
  - Use static_context_refs and role_context_ref by resolver reference.
  - Use dynamic context and evidence refs without repeating full analysis.
  - Return exact proof to PM L3.
authority:
  - Inspect files required by assigned scope.
  - Produce the requested implementation, validation, or audit output within assigned scope.
  - Classify blockers encountered during assigned work.
