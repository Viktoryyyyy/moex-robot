  task_contract:
    objective: Produce one fresh read-only evidence packet for current GitHub, server and n8n state, then compare those states with the prior RB-REC-01A v2 baseline.
    approved_inspection_scope:
      - Confirm current GitHub main SHA.
      - Confirm the canonical workflow Git blob SHA and raw SHA-256 at current GitHub main.
      - Capture current server repository root, HEAD SHA, origin/main SHA, checked-out branch, worktree status, changed files and ahead/behind status.
      - Capture current n8n workflow ID, version ID or updated_at, active state, publication state when verifiable, sanitized raw export and raw export SHA-256.
      - Compare GitHub main with server HEAD and server origin/main.
      - Compare the canonical GitHub workflow with the current n8n export at raw-hash and substantive configuration levels.
      - Compare current values with the prior RB-REC-01A v2 identifiers and hashes.
    owner_command_requirements:
      - Commands must be read-only evidence collection only.
      - Use the canonical command prefix: cd ~/moex_bot && source venv/bin/activate && cd moex-robot
      - git fetch origin main is allowed only as a metadata refresh; checkout, pull, reset, commit and push are forbidden.
      - Provide one command block at a time and do not use heredoc.
      - Sanitize tokens, passwords, cookies and secret-bearing payloads before returning evidence.
    forbidden_actions:
      - PostgreSQL inspection or any DB query.
      - Editing implementation, workflow JSON, tests, migrations or any repository file.
      - n8n workflow edit, import, publication, activation or execution.
      - Runtime smoke or endpoint invocation.
      - GitHub branch mutation, commit, PR, merge or direct-main write.
      - Server apply or server filesystem authoring.
      - Scope expansion into architecture or implementation recommendations.

  acceptance_criteria:
    - The task-context package is fetched at its exact immutable commit and context_ready is true before audit work begins.
    - Current GitHub main SHA and canonical workflow blob SHA plus raw SHA-256 are reported.
    - Current server HEAD, origin/main, branch, worktree state, changed files and ahead/behind result are reported.
    - Current n8n workflow identity, version or updated_at, active state, publication state, sanitized export and raw SHA-256 are reported.
    - GitHub-to-server and GitHub-to-n8n comparisons are explicit and evidence-based.
    - The prior RB-REC-01A v2 baseline is used only for comparison and is not reused as current evidence.
    - PostgreSQL inspection and all mutation actions remain absent.
    - Any unavailable evidence is reported as a precise blocker rather than inferred.

  not_in_scope:
    - PostgreSQL schema or data inspection.
    - Workflow correction or implementation design.
    - Any repository mutation outside or inside the context package.
    - PR creation, CI, merge, n8n publication, activation, runtime smoke or server apply.
    - Revalidation of RB-REC-01B or GAP-01.

