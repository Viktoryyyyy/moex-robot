contract_package_id: d1_tsmom_minimal_features.v1
schema_version: data_asset_contract_model.v1
status: target_declaration
activation_status: repo_only_not_live_authorized
instrument_registry_ref:
  registry_id: forts_instrument_registry.v1
  repo_path: configs/instruments/forts_instrument_registry.v1.yaml
artifacts:
  - artifact_id: features.d1.tsmom_minimal.v1
    artifact_class: feature_set
    path_contract_type: external_pattern
    storage_root_ref: MOEX_DATA_ROOT
    path_pattern: "${MOEX_DATA_ROOT}/forts/features/d1_tsmom_minimal/instrument_id={INSTRUMENT_ID}/config_version={CONFIG_VERSION}/part.parquet"
    producer: moex_features.daily.tsmom_minimal
    consumers:
      - experiments.d1.tsmom_minimal.run.v1
    format: parquet
    schema_version: features.d1_tsmom_minimal.v1
    input_artifacts:
      - dataset.forts.derived_d1.from_raw_5m.v1
    materialization_status: conditional_when_research_backtest_requires_features
    live_runtime_authorized: false
    research_backtest_authorized: true
    deterministic_builder_config_version_required: true
    partitioning:
      - instrument_id
      - config_version
    primary_key:
      - trade_date
      - instrument_id
      - series_type
    minimal_feature_contract:
      required_inputs:
        - trade_date
        - instrument_id
        - series_type
        - close
      feature_columns:
        - tsmom_lookback_return
        - tsmom_direction
        - tsmom_position_intent
      parameter_binding:
        lookback_window: builder_config
        signal_threshold: builder_config
        execution_delay: backtest_semantics_contract
    manifest_required: true
    quality_report_required: true
    anti_leakage_rules:
      feature_known_by: after_d1_bar_close
      no_future_rows_allowed: true
      labels_not_allowed_as_features: true
    path_rules:
      hardcoded_server_path_allowed: false
      implicit_file_selection_allowed: false
      latest_file_fallback_allowed: false
