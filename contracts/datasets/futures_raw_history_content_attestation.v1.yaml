contract_id: futures_raw_history_content_attestation.v1
status: implementation_candidate
producer: moex_data.futures.stage2_raw_history_content_reattestation.v2
producer_impl_ref: src/moex_data/futures/stage2_raw_history_content_reattestation.py
purpose: >
  Required exact-byte overlay for the already accepted Stage 2 raw histories.
  It publishes one immutable four-instrument generation and switches canonical
  content-attested state through one atomic batch marker.
lifecycle:
  base_raw_history_acceptance_remains_physical_and_date_set_gate: true
  content_attestation_is_required_second_gate_for_stage5_stage7: true
  legacy_stage2_pointers_mutated: false
  legacy_stage2_pointers_remain_compatibility_state: true
  canonical_content_attested_entrypoint: current_batch_marker
covered_scope:
  exact_scope_count: 4
  entries:
    - dataset_id: futures_raw_5m
      instrument_id: usdrubf_futures_family
    - dataset_id: futures_raw_5m
      instrument_id: cnyrubf_futures_family
    - dataset_id: futures_futoi_raw
      instrument_id: si_futures_family
    - dataset_id: futures_futoi_raw
      instrument_id: cr_futures_family
prior_state_policy:
  repository_stage2_expectation_required: true
  legacy_pointer_manifest_report_authenticated_against_repository_evidence: true
  explicit_prior_state_sha256_required: true
  current_marker_sha256_in_prior_state: true
  concurrent_writer_lock_required: true
  stale_prior_state_fails_closed: true
partition_content_policy:
  digest_algorithm: sha256
  digest_input: exact_parquet_file_bytes
  same_opened_inode_validation_and_hash_required: true
  validated_inode_hardlink_snapshot_required: true
  one_digest_per_accepted_trade_date: true
  deterministic_order: ascending_trade_date
  aggregate_serialization: trade_date_tab_sha256_newline
  accepted_date_set_must_match_repository_digest: true
  recorded_missing_dates_must_still_be_absent: true
publication_policy:
  generation_artifacts_create_only: true
  all_four_histories_validated_before_marker_switch: true
  canonical_partition_inode_and_sha_recheck_before_marker_switch: true
  missing_dates_recheck_before_marker_switch: true
  legacy_state_recheck_before_marker_switch: true
  marker_switch_atomic_replace: true
  partial_generation_is_not_canonical_without_marker: true
  crash_before_marker_switch_preserves_previous_canonical_state: true
  pointer_absence_window_allowed: false
current_marker:
  path: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/current_batch.json"
  schema_version: futures_raw_history_content_attested_batch_marker.v1
  exact_scope_count: 4
  single_canonical_generation_reference: true
downstream_policy:
  shared_resolver: moex_data.futures.stage2_raw_history_content_reattestation.resolve_content_attested_history
  stage5_stage7_must_use_resolver: true
  legacy_pointer_only_consumption_sufficient: false
  consumer_reads_generation_snapshots_not_mutable_canonical_raw: true
  consumer_rechecks_snapshot_sha256: true
execution_boundary:
  network_access_allowed: false
  historical_backfill_allowed: false
  latest_autodetect_allowed: false
  canonical_raw_mutation_allowed: false
