contract_id: futures_raw_history_accepted_manifest.v1
dataset_id: futures_raw_history_accepted_manifest
artifact_class: external_pattern
producer: moex_data.futures.stage2_raw_history_promotion
producer_impl_ref: src/moex_data/futures/stage2_raw_history_promotion.py
source_acceptance_contract_ref: contracts/datasets/futures_raw_history_acceptance.v1.yaml
format: json
schema_version: futures_raw_history_accepted_manifest.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/accepted_manifests/target_dataset_id={TARGET_DATASET_ID}/instrument_id={INSTRUMENT_ID}/acceptance_run_id={ACCEPTANCE_RUN_ID}/accepted_manifest.json"
grain: accepted_history_manifest_by_target_dataset_instrument_and_acceptance_run
required_fields:
  - schema_version
  - producer
  - dataset_id
  - target_dataset_id
  - target_dataset_contract_ref
  - instrument_id
  - acceptance_run_id
  - acceptance_contract_ref
  - acceptance_report_ref
  - acceptance_report_sha256
  - source_id
  - secid_scope
  - requested_from
  - requested_till
  - partition_count
  - row_count
  - partition_dates_sha256
  - missing_partition_dates
  - missing_dates_sha256
  - calendar_missing_partition_count
  - acceptance_status
  - network_access_used
  - historical_backfill_used
promotion_policy:
  acceptance_status_required: pass
  acceptance_evidence_written_required: true
  acceptance_report_digest_pinned: true
  acceptance_report_path_binding_required: true
  accepted_pointer_path_binding_required: true
  exact_partition_date_digest_match_required: true
  exact_missing_date_digest_match_required: true
  missing_partition_dates_pinned: true
  failed_partition_dates_empty_required: true
  hard_check_failures_empty_required: true
  pointer_absent_before_write_required: true
  pointer_create_only_required: true
  manifest_immutable_required: true
  network_access_allowed: false
  historical_backfill_allowed: false
pointer_policy:
  pointer_contract_source: target_dataset_contract
  pointer_partition_keys:
    - dataset_id
    - instrument_id
  manifest_ref_required: true
  acceptance_report_ref_required: true
  quality_report_ref_maps_to_acceptance_report: true
  quality_status_required: pass
  promotion_basis: raw_history_acceptance
execution_boundary:
  explicit_target_dataset_required: true
  explicit_instrument_required: true
  explicit_acceptance_run_required: true
  implicit_file_selection_allowed: false
  dynamic_partition_scan_allowed: false
  network_access_allowed: false
  historical_backfill_allowed: false
retention_policy: keep_all_accepted_history_manifests
