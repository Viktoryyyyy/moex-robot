contract_id: futures_data_refresh_manifest.v1
dataset_id: futures_data_refresh_manifest
artifact_class: external_pattern
producer: moex_data.futures.refresh_runner
consumers:
  - moex_data.futures.quality_report_builder
  - moex_data.futures.refresh_validator
format: json
schema_version: futures_data_refresh_manifest.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/refresh/run_date={YYYY-MM-DD}/run_id={RUN_ID}/manifest.json"
partitioning:
  - run_date
  - run_id
grain: refresh_run
primary_key:
  - run_id
required_fields:
  - run_id
  - run_date
  - requested_from
  - requested_till
  - instrument_scope
  - source_scope
  - dataset_contract_refs
  - partitions_written
  - partitions_skipped
  - quality_report_ref
  - accepted_manifest_ref
  - refresh_status
  - started_at
  - finished_at
  - source_contract
allowed_refresh_status:
  - succeeded
  - failed
  - partial
identity_model:
  canonical_identity_field: instrument_id
  source_identity_field: source_id
  family_scope_allowed: false
accepted_pointer_policy:
  writer: moex_data.futures.accepted_manifest.write_accepted_manifest_pointer
  reader: moex_data.futures.accepted_manifest.read_accepted_manifest_pointer
  write_gate:
    refresh_status: succeeded
    quality_status: pass
    instrument_scope: explicit_single_instrument_id
  read_gate:
    dataset_selection: explicit_dataset_id
    instrument_selection: explicit_instrument_id
    directory_scan_allowed: false
    implicit_latest_allowed: false
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
retention_policy: keep_all_runs
