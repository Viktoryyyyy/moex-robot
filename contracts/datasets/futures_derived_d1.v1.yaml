contract_id: futures_derived_d1.v1
dataset_id: futures_derived_d1
artifact_class: external_pattern
producer: moex_data.futures.resampler
consumers:
  - moex_data.futures.quality_report_builder
  - moex_backtest.engine
  - moex_features.daily
format: parquet
schema_version: futures_derived_d1.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/futures/derived_d1/instrument_id={INSTRUMENT_ID}/series_type={SERIES_TYPE}/part.parquet"
partitioning:
  - instrument_id
  - series_type
grain: d1_bar
source_contracts:
  - futures_raw_5m.v1
  - futures_continuous_5m.v1
primary_key:
  - trade_date
  - instrument_id
  - series_type
required_columns:
  - trade_date
  - instrument_id
  - symbol
  - series_type
  - open
  - high
  - low
  - close
  - volume
  - value
  - num_trades
  - source_schema_version
  - build_ts
quality_checks:
  - non_null_ohlc
  - high_ge_low
  - no_future_source_rows
  - duplicate_trade_date_instrument_id_series_type_count
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
retention_policy: rebuildable_from_source
