contract_package_id: forts_raw_5m_tradestats.v1
schema_version: data_asset_contract_model.v1
status: target_declaration
activation_status: repo_only_not_registered_in_loaded_dataset_config
loaded_config_mutation_allowed: false
instrument_registry_ref:
  registry_id: forts_instrument_registry.v1
  repo_path: configs/instruments/forts_instrument_registry.v1.yaml
artifacts:
  - artifact_id: external.apim.fo.tradestats.v1
    artifact_class: external_source_contract
    path_contract_type: repo_relative
    repo_relative_path: contracts/datasets/forts_raw_5m_tradestats.v1.yaml
    producer: moex_external.apim
    consumers:
      - dataset.forts.raw_5m.tradestats.v1
    format: http_json
    source:
      endpoint: /iss/datashop/algopack/fo/tradestats.json
      engine: futures
      market: forts
      board: rfud
      native_grain: 5m
      table: tradestats
      required_query_params:
        from: explicit_cli_argument
        till: explicit_cli_argument
        secid: explicit_cli_argument
        start: pagination_argument
        iss.meta: "off"
        iss.only: tradestats
    env_dependencies:
      - name: MOEX_API_URL
        purpose: endpoint_base_url
      - name: APIM_FO_TRADESTATS_ACCESS
        purpose: optional_access_policy_or_credentials_reference
    env_dependency_rule: env_dependencies_are_not_artifact_path_contract_type
    calendar_base_rule: MOEX_API_URL_is_not_calendar_base_url_for_incremental_refresh
    failure_semantics:
      empty_response: fail_closed
      schema_mismatch: fail_closed
      unresolved_calendar_or_session: fail_closed
      implicit_fallback: forbidden

  - artifact_id: external.moex.iss.futures_calendar.v1
    artifact_class: external_calendar_source_contract
    path_contract_type: env_contract
    producer: moex_external.iss_calendar
    consumers:
      - moex_data.futures.refresh_forts_raw_5m_incremental_pointer.v1
      - dataset.forts.raw_5m.tradestats.v1
    format: http_json
    source:
      default_base_url: https://iss.moex.com
      base_url_env: MOEX_CALENDAR_BASE_URL
      base_url_cli_argument: --calendar-base-url
      endpoint: /iss/calendars.json
      table: off_days
      market_field: futures_
      required_query_params:
        from: explicit_date_argument
        till: explicit_date_argument
        iss.only: off_days
        show_all_days: "1"
        start: pagination_argument
    base_url_resolution_order:
      - --calendar-base-url
      - MOEX_CALENDAR_BASE_URL
      - default_base_url
    moex_api_url_calendar_base_assumption_allowed: false
    scheduler_binding_status: unresolved_for_server_scheduler
    scheduler_blocker_note: MOEX calendar endpoint unresolved for server scheduler; use observed-source incremental mode for daily pointer refresh until endpoint contract is resolved.
    preflight_validation:
      http_status: raise_for_status
      content_type_must_contain: json
      required_top_level_table: off_days
      required_table_shape:
        columns: list
        data: list
    failure_semantics:
      non_json_or_html_response: calendar_fetch_non_json_response
      missing_off_days_table: calendar_response_missing_off_days_table
      invalid_off_days_shape: calendar_response_invalid_off_days_table_shape
      implicit_fallback: forbidden
      pointer_update_on_failure: forbidden

  - artifact_id: dataset.forts.raw_5m.tradestats.v1
    artifact_class: raw_native_dataset
    path_contract_type: external_pattern
    storage_root_ref: MOEX_DATA_ROOT
    path_pattern: "${MOEX_DATA_ROOT}/forts/raw_5m/tradestats/trade_date={YYYY-MM-DD}/instrument_id={INSTRUMENT_ID}/secid={SECID}/part.parquet"
    producer: moex_data.futures.materialize_forts_raw_5m_tradestats.v1
    source_artifact_id: external.apim.fo.tradestats.v1
    calendar_source_artifact_id: external.moex.iss.futures_calendar.v1
    consumers:
      - dataset.forts.derived_d1.from_raw_5m.v1
      - reports.data_asset_manifest_quality_report.v1
      - state.dataset.forts.raw_5m.tradestats.current_accepted_manifest.v1
    format: parquet
    schema_version: dataset.forts.raw_5m.tradestats.v1
    grain: 5m_bar
    partitioning:
      - trade_date
      - instrument_id
      - secid
    primary_key:
      - ts
      - secid
    required_columns:
      - trade_date
      - ts
      - session_date
      - secid
      - instrument_id
      - board
      - open
      - high
      - low
      - close
      - volume
      - value
      - num_trades
      - source
      - ingest_ts
    manifest_required: true
    quality_report_required: true
    retention_policy: keep_all_valid_partitions
    storage_vs_recompute:
      policy: store_raw_native_partitions
      recompute_allowed: false
      overwrite_allowed: false_without_explicit_rebuild_task
    path_rules:
      hardcoded_server_path_allowed: false
      implicit_file_selection_allowed: false
      latest_file_fallback_allowed: false
      env_credentials_as_path_contract_type_allowed: false

  - artifact_id: state.dataset.forts.raw_5m.tradestats.current_accepted_manifest.v1
    artifact_class: accepted_manifest_pointer
    path_contract_type: external_pattern
    storage_root_ref: MOEX_DATA_ROOT
    path_pattern: "${MOEX_DATA_ROOT}/state/datasets/artifact_id=dataset.forts.raw_5m.tradestats.v1/current_accepted_manifest.json"
    producer: moex_data.futures.refresh_forts_raw_5m_incremental_pointer.v1
    consumers:
      - moex_data.futures.refresh_forts_raw_5m_incremental_pointer.v1
      - dataset.forts.derived_d1.from_raw_5m.v1
      - reports.data_asset_manifest_quality_report.v1
    format: json
    schema_version: state.dataset.forts.raw_5m.tradestats.current_accepted_manifest.v1
    target_artifact_id: dataset.forts.raw_5m.tradestats.v1
    target_manifest_artifact_id: manifest.data_asset.v1
    target_quality_report_artifact_id: reports.data_asset.quality.v1
    calendar_source_artifact_id: external.moex.iss.futures_calendar.v1
    required_fields:
      - artifact_id
      - artifact_class
      - schema_version
      - target_artifact_id
      - accepted_manifest_reference
      - accepted_quality_report_reference
      - accepted_artifact_version
      - quality_status
      - instrument_id_scope
      - secid_scope
      - data_start
      - data_end
      - last_valid_trade_date
      - row_count
      - partition_count
      - calendar_source_artifact_id
      - calendar_binding_status
      - incremental_mode
      - updated_at
      - latest_autodetect_used
    update_semantics:
      atomic_update_required: true
      atomic_update_rule: write_temp_file_in_pointer_directory_then_replace
      advance_rule: only_after_quality_status_passed
      failed_quality_status_rule: pointer_must_remain_unchanged
      calendar_failure_rule: pointer_must_remain_unchanged
      observed_source_empty_date_rule: record_in_skipped_empty_source_dates_not_failed_dates
      observed_source_failure_rule: record_in_failed_dates_and_keep_pointer_unchanged
      latest_or_glob_discovery_allowed: false
      implicit_path_selection_allowed: false
    path_rules:
      hardcoded_server_path_allowed: false
      implicit_file_selection_allowed: false
      latest_file_fallback_allowed: false
      glob_discovery_allowed: false

raw_5m_readiness_contract:
  initial_backfill:
    data_start: "2020-01-01"
    data_end_rule: last_completed_valid_trading_day
    source_artifact_id: external.apim.fo.tradestats.v1
    calendar_source_artifact_id: external.moex.iss.futures_calendar.v1
    artifact_id: dataset.forts.raw_5m.tradestats.v1
    execution_status: declaration_only_not_materialized_by_this_contract_patch

  incremental_update:
    producer: moex_data.futures.refresh_forts_raw_5m_incremental_pointer.v1
    base_manifest_source: state.dataset.forts.raw_5m.tradestats.current_accepted_manifest.v1
    base_manifest_source_rule: read_accepted_manifest_reference_from_stable_pointer_path
    stable_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/artifact_id=dataset.forts.raw_5m.tradestats.v1/current_accepted_manifest.json"
    default_incremental_mode: calendar
    supported_incremental_modes:
      calendar:
        cli_argument: --incremental-mode calendar
        start_rule: pointer_accepted_manifest_last_valid_trade_date_plus_1_valid_trading_day
        start_rule_detail: accepted manifest last_valid_trade_date + 1 valid trading day
        end_rule: last_completed_valid_trading_day
        calendar: moex_iss_futures_calendar.off_days.v1
        calendar_source_artifact_id: external.moex.iss.futures_calendar.v1
        calendar_endpoint_call_allowed: true
      observed_source:
        cli_argument: --incremental-mode observed-source
        calendar_binding_status: observed_source_calendar_fallback
        calendar_endpoint_call_allowed: false
        calendar_endpoint_status: unresolved_for_server_scheduler
        calendar_endpoint_unresolved_note: MOEX calendar endpoint unresolved for server scheduler; /iss/calendars.json and /iss/calendars/futures.json returned text/html in server preflight while ISS securities endpoint returned JSON.
        start_rule: pointer_accepted_manifest_last_valid_trade_date_plus_1_calendar_day
        start_rule_detail: accepted manifest last_valid_trade_date + 1 calendar day, without MOEX calendar endpoint call
        end_rule: effective_upper_bound
        end_rule_detail: normally yesterday/as_of_date - 1 unless explicit date_end is supplied
        candidate_dates_rule: every calendar day from start_rule through effective_upper_bound inclusive
        materializer_rule: call_existing_raw_5m_materializer_for_each_candidate_date
        rows_present_rule: create_partition_and_include_in_manifest
        empty_source_rule: record_date_in_skipped_empty_source_dates_and_do_not_fail_quality
        source_network_api_schema_failure_rule: record_date_in_failed_dates_and_keep_pointer_unchanged
        pointer_update_rule: atomically_replace_pointer_only_after_quality_status_passed
    start_rule: pointer_accepted_manifest_last_valid_trade_date_plus_1_valid_trading_day
    start_rule_detail: accepted manifest last_valid_trade_date + 1 valid trading day
    end_rule: last_completed_valid_trading_day
    calendar: moex_iss_futures_calendar.off_days.v1
    calendar_source_artifact_id: external.moex.iss.futures_calendar.v1
    calendar_base_url_contract:
      env: MOEX_CALENDAR_BASE_URL
      cli_argument: --calendar-base-url
      default_base_url: https://iss.moex.com
      moex_api_url_calendar_base_assumption_allowed: false
    calendar_endpoint: /iss/calendars.json
    calendar_required_table: off_days
    calendar_preflight_required: true
    calendar_binding_status: observed_source_calendar_fallback
    calendar_endpoint_status: unresolved_for_server_scheduler
    observed_source_calendar_fallback_enabled: true
    observed_source_empty_source_record_field: skipped_empty_source_dates
    calendar_failure_semantics:
      non_json_or_html_response: calendar_fetch_non_json_response
      missing_off_days_table: calendar_response_missing_off_days_table
      invalid_off_days_shape: calendar_response_invalid_off_days_table_shape
      pointer_update_rule: pointer_must_remain_unchanged
    pointer_update_rule: atomically_replace_pointer_only_after_quality_status_passed
    failed_quality_status_rule: pointer_must_remain_unchanged
    latest_file_autodetect_allowed: false
    implicit_path_selection_allowed: false
    glob_discovery_allowed: false

  instrument_scope:
    registry_id: forts_instrument_registry.v1
    registry_ref: configs/instruments/forts_instrument_registry.v1.yaml
    scope_rule: explicit_instrument_id_and_secid_from_approved_registry
    required_partition_keys:
      - instrument_id
      - secid
    legacy_family_allowlist_allowed: false
    unresolved_instrument_blocks_full_readiness: true

  readiness_evidence_required_before_D1:
    manifest_reference_required: true
    accepted_manifest_pointer_reference_required: true
    quality_report_reference_required: true
    required_manifest_or_quality_fields:
      - artifact_id
      - source_artifact_id
      - calendar_source_artifact_id
      - schema_version
      - data_start
      - data_end
      - last_valid_trade_date
      - row_count
      - instrument_id_scope
      - secid_scope
      - calendar_contract
      - calendar_binding_status
      - session_binding
      - storage_pattern
      - content_hash_or_partition_hashes
      - build_started_at
      - build_finished_at
    readiness_blocks_if_missing:
      - accepted_manifest_pointer_reference
      - actual_manifest_reference
      - actual_quality_report_reference
      - data_start
      - data_end
      - last_valid_trade_date
      - row_count
      - approved_instrument_scope
      - calendar_session_binding

  raw_5m_readiness_status_rule:
    ready_for_D1_readiness_gate: accepted_manifest_pointer_present_and_all_required_readiness_evidence_present_and_quality_status_passing
    blocked_pending_data_materialization: contract_complete_but_no_materialized_manifest_or_quality_evidence_exists
    not_ready: contract_declarations_or_required_evidence_fields_missing
