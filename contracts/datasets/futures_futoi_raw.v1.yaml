contract_id: futures_futoi_raw.v1
dataset_id: futures_futoi_raw
artifact_class: external_pattern
producer: moex_data.futures.materialize_futoi_instrument
consumers:
  - moex_data.futures.validation
format: parquet
schema_version: futures_futoi_raw.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/supplementary/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
partitioning:
  - dataset_id
  - instrument_id
  - trade_date
  - source_id
grain: futoi_source_record_by_clgroup
identity_model:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - secid
    - board
    - market
    - engine
    - source_id
  optional_source_grouping_fields:
    - family_code
    - source_ticker
  family_as_canonical_identity_allowed: false
timestamp_semantics:
  canonical_ts_field: ts
  canonical_ts_source_fields:
    - tradedate
    - tradetime
  canonical_ts_meaning: last_trade_included_in_calculation
  source_reference_ts_field: moment
  source_reference_ts_meaning: same_as_canonical_ts
  source_publication_ts_field: systime
  source_publication_ts_meaning: moex_source_publication_metadata
  historical_systime_note: historical APIM rows may share a later archival/republication systime and therefore systime is not a raw event-time identity key
  canonical_key_fields:
    - trade_date
    - sess_id
    - seqnum
    - secid
    - clgroup
  analytical_revision_key_fields:
    - trade_date
    - ts
    - secid
    - clgroup
  revision_policy: raw_preserve_all_source_records; resolve revisions only in a separate derived analytical layer
required_columns:
  - instrument_id
  - trade_date
  - ts
  - moment
  - systime
  - sess_id
  - seqnum
  - secid
  - board
  - market
  - engine
  - source_id
  - source_ticker
  - clgroup
  - pos
  - pos_long
  - pos_short
  - pos_long_num
  - pos_short_num
  - availability_ts_utc
  - ingest_ts
availability:
  availability_timestamp_required: true
  availability_timestamp_field: availability_ts_utc
  source_id_required: true
source_contract:
  source_id: moex_algopack_futoi
  source_contract_ref: contracts/sources/futures/moex_algopack_futoi.v1.yaml
  exact_registry_ticker_binding_required: true
  fallback_endpoint_allowed: false
  public_iss_transport_allowed: false
materialization:
  partition_producer: moex_data.futures.materialize_futoi_instrument
  controlled_backfill_producer: moex_data.futures.backfill_futoi_instrument
  instrument_registry_ref: configs/instruments/forts_instrument_registry.v1.yaml
  data_lake_config_ref: configs/datasets/futures_data_lake.v1.yaml
  authentication_env: MOEX_API_KEY
  source_selection: explicit_source_id_from_registry
  instrument_selection: explicit_instrument_id
  ticker_selection: exact_registry_binding
  date_selection: explicit_date_or_approved_range
  latest_parameter: 0
  fallback_source_allowed: false
  single_partition_cli_required_fields:
    - trade_date
    - instrument_id
    - run_id
  backfill_cli_required_fields:
    - date_start
    - date_end
    - instrument_id
    - run_id
state_contracts:
  quality_contract_ref: contracts/datasets/futures_futoi_quality_report.v1.yaml
  refresh_manifest_contract_ref: contracts/datasets/futures_futoi_refresh_manifest.v1.yaml
  accepted_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
execution_result_metadata_fields:
  - status
  - dataset_id
  - instrument_id
  - source_id
  - secid
  - futoi_ticker
  - trade_date
  - row_count
  - quality_status
  - storage_partition_path
  - quality_report_reference
  - manifest_reference
  - accepted_manifest_pointer_reference
  - source_contract_ref
  - latest_autodetect_used
  - hardcoded_server_path_used
  - timestamp_semantics
  - source_record_key_fields
  - exact_duplicate_rows_dropped
quality_checks:
  - row_count_positive
  - duplicate_source_record_key_count_zero
  - null_required_count_zero
  - invalid_position_count_zero
  - availability_status_available
  - probe_status_completed
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
retention_policy: keep_all_valid_source_records
