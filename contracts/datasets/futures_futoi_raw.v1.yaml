contract_id: futures_futoi_raw.v1
dataset_id: futures_futoi_raw
artifact_class: external_pattern
producer: moex_data.futures.materialize_futoi_instrument
consumers:
  - moex_data.futures.validation
format: parquet
schema_version: futures_futoi_raw.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/supplementary/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
partitioning:
  - dataset_id
  - instrument_id
  - trade_date
  - source_id
grain: futoi_observation
identity_model:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - secid
    - board
    - market
    - engine
    - source_id
  optional_source_grouping_fields:
    - family_code
    - source_ticker
  family_as_canonical_identity_allowed: false
required_columns:
  - instrument_id
  - trade_date
  - ts
  - secid
  - board
  - market
  - engine
  - source_id
  - source_ticker
  - clgroup
  - pos
  - pos_long
  - pos_short
  - pos_long_num
  - pos_short_num
  - availability_ts_utc
  - ingest_ts
availability:
  availability_timestamp_required: true
  availability_timestamp_field: availability_ts_utc
  source_id_required: true
source_contract:
  source_id: moex_iss_futoi
  source_contract_ref: contracts/sources/futures/moex_iss_futoi.v1.yaml
  exact_registry_ticker_binding_required: true
  fallback_endpoint_allowed: false
quality_contract_ref: contracts/datasets/futures_futoi_quality_report.v1.yaml
refresh_manifest_contract_ref: contracts/datasets/futures_futoi_refresh_manifest.v1.yaml
accepted_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
retention_policy: keep_all_valid_partitions
