contract_id: futures_futoi_raw.v1
dataset_id: futures_futoi_raw
artifact_class: external_pattern
producer: moex_data.iss.source_contracts
consumers:
  - moex_data.futures.validation
format: parquet
schema_version: futures_futoi_raw.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/supplementary/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
partitioning:
  - dataset_id
  - instrument_id
  - trade_date
  - source_id
grain: futoi_observation
identity_model:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - secid
    - board
    - market
    - engine
  optional_source_grouping_fields:
    - family
  family_as_canonical_identity_allowed: false
required_identifier_fields:
  - instrument_id
  - source_id
  - secid
  - board
  - market
  - engine
  - trade_date
availability:
  availability_timestamp_required: true
  source_id_required: true
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
retention_policy: keep_all_valid_partitions
