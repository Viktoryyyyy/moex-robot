contract_id: step7_rub_native_d1_w1_technical_acceptance.v1
artifact_class: external_pattern
producer: moex_data.step7_rub_native_d1_w1_acceptance
program_ref: configs/datasets/step7_rub_native_d1_w1_technical.v1.yaml
pilot_evidence_path_pattern: "${MOEX_DATA_ROOT}/state/acceptance/step7_rub_native_d1_w1/run_id={RUN_ID}/pilot_evidence.json"
acceptance_evidence_path_pattern: "${MOEX_DATA_ROOT}/state/acceptance/step7_rub_native_d1_w1/run_id={RUN_ID}/accepted_pointers.json"
expected_outputs:
  ohlcv:
    dataset_id: rub_native_ohlcv_htf
    timeframes:
      - 1D
      - 1W
    instruments:
      - usdrubf_futures_family
      - cnyrubf_futures_family
  technical:
    dataset_id: rub_technical_features_htf
    timeframes:
      - 1D
      - 1W
    instruments:
      - usdrubf_futures_family
      - cnyrubf_futures_family
  accepted_pointer_count: 8
validation_policy:
  pilot_status_required: pilot_passed
  immutable_run_required: true
  network_calls_used_required: false
  latest_autodetect_used_required: false
  continuous_series_used_required: false
  accepted_raw_history_required: true
  content_attested_source_mode_required: stage2_content_attested_generation_snapshots_only
  legacy_accepted_pointer_consumption_used_required: false
  current_content_attestation_generation_must_match_frozen_upstream: true
  current_content_attestation_marker_ref_and_sha256_must_match_frozen_upstream: true
  current_content_attested_manifest_ref_and_sha256_must_match_frozen_upstream: true
  current_content_attested_partition_content_set_must_match_frozen_upstream: true
  current_content_attested_date_set_and_counts_must_match_frozen_upstream: true
  current_content_attested_snapshot_record_map_required: true
  current_content_attested_snapshot_same_byte_sha256_identity_revalidation_required: true
  frozen_raw_inode_must_differ_from_live_content_attested_snapshot: true
  run_manifest_validated_source_identity_is_not_independence_oracle: true
  frozen_raw_manifest_required: true
  frozen_raw_partition_inside_declared_run_root_required: true
  frozen_raw_partition_inside_declared_input_dataset_root_required: true
  frozen_raw_partition_sha256_recheck_required: true
  frozen_raw_independent_inode_exact_byte_copy_required: true
  frozen_raw_single_open_byte_snapshot_hash_and_parse_required: true
  frozen_raw_descriptor_and_path_stat_stability_required: true
  frozen_raw_physical_revalidation_required: true
  independent_oracle_must_consume_captured_validated_frame: true
  physical_quote_validation_must_not_depend_on_pre_promotion_stage2_status: true
  all_outputs_inside_declared_run_root: true
  physical_parquet_readback_required: true
  output_single_open_byte_snapshot_hash_and_parse_required: true
  output_descriptor_and_path_stat_stability_required: true
  output_partition_manifest_quality_sha256_required: true
  manifest_quality_identity_and_row_count_match_required: true
  d1_expected_rows:
    usdrubf_futures_family: 1100
    cnyrubf_futures_family: 1100
  d1_ohlcv_reaggregation_required: true
  w1_completed_week_only_required: true
  w1_ohlcv_reaggregation_from_d1_required: true
  source_lineage_sha256_required: true
  technical_source_identity_period_availability_exact_match_required: true
  technical_formula_recalculation_required: true
  technical_zero_previous_close_denominator_rejected: true
  technical_non_null_numeric_features_must_be_finite: true
  atr_wilder_seed_and_recurrence_recalculation_required: true
  no_future_rows_required: true
promotion_policy:
  validate_all_before_pointer_writes: true
  pointer_run_id_source: referenced_manifest_run_id
  acceptance_run_id_stored_separately: true
  pointer_promotion_mode: serialized_transactional_with_rollback
  stage7_publication_lock_required: true
  stage2_content_attestation_lock_required_during_validation_and_commit: true
  stage2_marker_identity_recheck_immediately_before_pointer_writes: true
  pointer_content_sha256_binding_required: true
  acceptance_evidence_content_sha256_binding_required: true
  output_identity_and_sha256_recheck_immediately_before_pointer_writes: true
  final_acceptance_marker_participates_in_same_transaction: true
  partial_pointer_set_without_acceptance_marker_is_not_accepted: true
readiness_boundaries:
  si_cr_continuous_ready: false
  weekly_oi_ready: false
  advanced_technical_policy_ready: false
  research_ready: false
