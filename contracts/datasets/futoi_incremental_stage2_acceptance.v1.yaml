dataset_id: futoi_incremental_stage2_acceptance
schema_version: futoi_incremental_stage2_acceptance.v1
status: implementation_candidate
producer: moex_data.futures.futoi_incremental_stage2_acceptance.v1
target_dataset_id: futures_futoi_raw

purpose:
  - extend canonical live FUTOI coverage without mutating the historical Stage 2 accepted pointer
  - bind every incremental acceptance generation to the current content-attested historical base
  - fail closed before pointer publication on any raw quality, lineage, calendar, or concurrency failure

scope:
  instruments:
    - si_futures_family
    - cr_futures_family
  source_id: moex_algopack_futoi
  required_clgroups:
    - FIZ
    - YUR

historical_base:
  resolver: moex_data.futures.stage2_raw_history_content_reattestation.resolve_content_attested_history
  immutable: true
  historical_pointer_replacement_allowed: false
  required_bindings:
    - generation_id
    - marker_ref
    - marker_sha256
    - manifest_ref
    - manifest_sha256
    - base_last_trade_date
    - accepted_partition_dates_sha256

calendar:
  source_id: moex_iss_futures_calendar
  endpoint: /iss/calendars.json
  explicit_upper_bound_required: true
  implicit_weekday_assumption_allowed: false
  missing_calendar_date_policy: fail_closed

raw_materialization:
  producer: moex_data.futures.materialize_futoi_instrument.materialize_futoi_partition
  require_enabled: false
  explicit_trade_date_required: true
  latest_autodetect_allowed: false
  latest_parameter: 0
  transport: authenticated_apim
  token_env: MOEX_API_KEY

partition_acceptance:
  required:
    - status=succeeded
    - quality_status=pass
    - row_count>0
    - clgroup_scope_exactly_FIZ_YUR
    - duplicate_source_key_count=0
    - null_required_count=0
    - invalid_position_count=0
  freeze_mode: independent_inode_exact_byte_copy
  source_stability_check: sha256_before_equals_frozen_equals_sha256_after

artifacts:
  immutable_run_path_pattern: ${MOEX_DATA_ROOT}/state/acceptance/futoi_incremental_stage2/instrument_id={INSTRUMENT_ID}/run_id={RUN_ID}/
  manifest_name: accepted_manifest.json
  quality_report_name: quality_report.json
  pointer_path_pattern: ${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_incremental_accepted_manifest.json

promotion:
  pointer_update: atomic_replace_under_flock
  previous_pointer_compare_required: true
  base_generation_recheck_required: true
  advance_only_after_full_quality_pass: true
  failure_rule: pointer_must_remain_unchanged
  cumulative_records: true
  historical_pointer_replaced: false

authority:
  stage5_live_consumption: blocked_until_separate_stage5_incremental_acceptance
  snapshot_live_enable: false
  directional_authority: false
  action_authority: false
  buy_sell_authority: false
