contract_id: futures_futoi_refresh_manifest.v1
dataset_id: futures_futoi_refresh_manifest
artifact_class: external_pattern
producer: moex_data.futures.materialize_futoi_instrument
consumers:
  - moex_data.futures.futoi_acceptance
format: json
schema_version: futures_futoi_refresh_manifest.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/refresh/dataset_id=futures_futoi_raw/run_date={YYYY-MM-DD}/run_id={RUN_ID}/manifest.json"
grain: futoi_refresh_run
identity_model:
  canonical_identity_field: instrument_id
  source_identity_field: source_id
required_fields:
  - run_id
  - run_date
  - dataset_id
  - instrument_scope
  - source_scope
  - requested_from
  - requested_till
  - partitions_written
  - partitions_skipped
  - quality_report_ref
  - accepted_manifest_ref
  - refresh_status
  - source_contract
  - producer
  - latest_autodetect_used
  - hardcoded_server_path_used
  - exact_duplicate_rows_dropped
source_contract_required_fields:
  - source_id
  - source_contract_ref
  - raw_contract_ref
  - futoi_ticker
  - source_endpoint_url
  - transport
  - timestamp_semantics
  - source_record_key_fields
expected_source_contract_values:
  source_id: moex_algopack_futoi
  transport: authenticated_apim
  timestamp_semantics: "ts=source_reference_moment;systime=source_publication_metadata"
  source_record_key_fields:
    - trade_date
    - sess_id
    - seqnum
    - secid
    - clgroup
allowed_refresh_status:
  - succeeded
  - failed
  - partial
accepted_pointer_policy:
  path_pattern: "${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
  update_requires_quality_status: pass
  update_requires_refresh_status: succeeded
  single_instrument_scope_required: true
  secid_pointer_partition_allowed: false
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
