contract_id: futures_futoi_refresh_manifest.v2
dataset_id: futures_futoi_refresh_manifest
artifact_class: external_pattern
producer: moex_data.futures.materialize_futoi_instrument
format: json
schema_version: futures_futoi_refresh_manifest.v2
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/refresh/dataset_id=futures_futoi_raw/schema_version=v2/run_date={YYYY-MM-DD}/run_id={RUN_ID}/manifest.json"
grain: one_explicit_instrument_date_run
required_fields:
  - schema_version
  - run_id
  - run_date
  - dataset_id
  - instrument_id
  - source_id
  - source_ticker
  - raw_schema_version
  - source_identity_scope
  - source_record_key_fields
  - instrument_scope
  - source_scope
  - requested_from
  - requested_till
  - partitions_written
  - partitions_skipped
  - quality_report_ref
  - refresh_status
  - producer
  - source_contract
  - accepted_manifest_ref
  - accepted_manifest_pointer_reference
  - factual_authority
field_values:
  dataset_id: futures_futoi_raw
  raw_schema_version: v2
  source_identity_scope: source_ticker_root
  producer: moex_data.futures.materialize_futoi_instrument.v2
  accepted_manifest_ref: null
  accepted_manifest_pointer_reference: null
  factual_authority: false
allowed_refresh_status: [succeeded, failed]
success_requires:
  publication_run_id: exact_requested_run_id
  published_partition_sha256: digest_of_written_parquet_bytes
  partitions_written: exact_single_v2_partition
  quality_status: pass
  source_endpoint_url: exact_request_endpoint
failure_requires:
  partitions_written: empty
  refresh_status: failed
  error_detail: referenced_quality_report
version_rules:
  source_raw_quality_manifest_versions: v2
  v1_default_and_paths: unchanged
  version_or_path_mismatch_fallback: forbidden
  cross_instrument_run_id_reuse: forbidden
  accepted_pointer_promotion: false
  stage5_or_model_or_trade_authority: false
