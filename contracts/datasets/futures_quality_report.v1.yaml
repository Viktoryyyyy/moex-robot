contract_id: futures_quality_report.v1
artifact_class: repo_relative
repo_path: contracts/datasets/futures_quality_report.v1.yaml
purpose: quality report contract for one futures OHLCV partition
producer: moex_data.quality.futures_ohlcv
format: json
schema_version: futures_quality_report.v1
statuses:
  - pass
  - warn
  - fail
fail_blocks_downstream_consumption: true
required_fields:
  - dataset_id
  - timeframe
  - SERIES_TYPE
  - FAMILY
  - SECID
  - BOARD
  - MARKET
  - partition_key
  - status
  - downstream_consumption_allowed
  - row_count
  - duplicate_ts_secid_count
  - non_monotonic_timestamp_count
  - invalid_ohlc_count
  - negative_volume_count
  - negative_value_count
  - negative_trades_count
hard_checks:
  - duplicate_ts_secid_count
  - non_monotonic_timestamp_count
  - invalid_ohlc_count
  - negative_volume_count
  - negative_value_count
  - negative_trades_count
parent_manifest_consistency_required: true
path_rules:
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
