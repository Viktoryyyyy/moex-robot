contract_id: futures_quality_report.v1
dataset_id: futures_quality_report
artifact_class: external_pattern
producer: moex_data.quality.futures_ohlcv
consumers:
  - moex_data.futures.validation
format: json
schema_version: futures_quality_report.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/quality/run_date={YYYY-MM-DD}/run_id={RUN_ID}/quality_report.json"
partitioning:
  - run_date
  - run_id
grain: partition_quality_report
identity_model:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - secid
    - board
    - market
    - engine
  family_as_canonical_identity_allowed: false
primary_key:
  - dataset_id
  - timeframe
  - instrument_id
  - source_id
  - partition_key
statuses:
  - pass
  - warn
  - fail
allowed_quality_status:
  - pass
  - warn
  - fail
fail_blocks_downstream_consumption: true
required_fields:
  - dataset_id
  - timeframe
  - instrument_id
  - source_id
  - secid
  - board
  - market
  - engine
  - partition_key
  - status
  - downstream_consumption_allowed
  - row_count
  - duplicate_key_count
  - non_monotonic_timestamp_count
  - invalid_ohlc_count
  - negative_volume_count
  - negative_value_count
  - negative_trades_count
hard_checks:
  - duplicate_key_count
  - non_monotonic_timestamp_count
  - invalid_ohlc_count
  - negative_volume_count
  - negative_value_count
  - negative_trades_count
parent_manifest_consistency_required: true
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
retention_policy: keep_all_partition_reports
