contract_id: futures_derived_w1.v1
dataset_id: futures_derived_w1
artifact_class: external_pattern
producer: moex_data.futures.resampler
consumers:
  - moex_data.futures.quality_report_builder
  - moex_backtest.engine
  - moex_features.daily
format: parquet
schema_version: futures_derived_w1.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/derived/timeframe=1W/instrument_id={INSTRUMENT_ID}/part.parquet"
partitioning:
  - timeframe
  - instrument_id
grain: w1_bar
source_contracts:
  - futures_raw_5m.v1
  - futures_continuous_5m.v1
identity_model:
  canonical_identity_field: instrument_id
  family_as_canonical_identity_allowed: false
primary_key:
  - week_start_date
  - instrument_id
  - timeframe
required_columns:
  - week_start_date
  - week_end_date
  - instrument_id
  - canonical_symbol
  - timeframe
  - open
  - high
  - low
  - close
  - volume
  - value
  - num_trades
  - source_schema_version
  - build_ts
quality_checks:
  - non_null_ohlc
  - high_ge_low
  - duplicate_week_instrument_id_count
  - calendar_week_boundary_check
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
retention_policy: rebuildable_from_source
