contract_id: futures_raw_history_content_attested_manifest.v1
dataset_id: futures_raw_history_content_attested_manifest
artifact_class: external_pattern
producer: moex_data.futures.stage2_raw_history_content_reattestation.v2
format: json
schema_version: futures_raw_history_content_attested_manifest.v1
storage_root_ref: MOEX_DATA_ROOT
generation_root_pattern: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/generation_id={GENERATION_ID}"
manifest_path_pattern: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/generation_id={GENERATION_ID}/manifests/dataset_id={DATASET_ID}/instrument_id={INSTRUMENT_ID}/accepted_manifest.json"
report_path_pattern: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/generation_id={GENERATION_ID}/reports/dataset_id={DATASET_ID}/instrument_id={INSTRUMENT_ID}/content_attestation_report.json"
snapshot_path_pattern: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/generation_id={GENERATION_ID}/raw/dataset_id={DATASET_ID}/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/part.parquet"
current_marker_path: "${MOEX_DATA_ROOT}/state/accepted_manifests/raw_history_content_attestation/current_batch.json"
required_manifest_fields:
  - schema_version
  - producer
  - run_id
  - dataset_id
  - instrument_id
  - source_id
  - requested_from
  - requested_till
  - partition_count
  - row_count
  - partition_dates_sha256
  - missing_partition_dates
  - missing_dates_sha256
  - partition_content_records
  - partition_content_set_sha256
  - content_attestation_report_ref
  - content_attestation_report_sha256
  - legacy_pointer_sha256
  - legacy_manifest_sha256
  - legacy_report_sha256
  - acceptance_status
  - promotion_basis
  - network_access_used
  - historical_backfill_used
partition_record_required_fields:
  - trade_date
  - sha256
  - row_count
  - secids
  - canonical_ref
  - snapshot_ref
  - source_device
  - source_inode
  - source_size
  - source_mtime_ns
marker_contract:
  schema_version: futures_raw_history_content_attested_batch_marker.v1
  status_required: accepted
  exact_scope_count: 4
  entry_fields:
    - dataset_id
    - instrument_id
    - manifest_ref
    - manifest_sha256
    - report_ref
    - report_sha256
    - partition_content_set_sha256
  prior_state_sha256_required: true
  prior_marker_sha256_recorded: true
  legacy_pointers_mutated_required: false
  single_atomic_marker_switch_required: true
  generation_artifacts_create_only_required: true
immutability_policy:
  snapshot_is_hardlink_to_physically_validated_inode: true
  manifest_create_only: true
  report_create_only: true
  marker_is_only_mutable_canonical_reference: true
  orphan_generation_after_pre_switch_crash_is_noncanonical: true
downstream_policy:
  resolve_only_through_current_marker: true
  verify_manifest_and_report_sha256: true
  verify_partition_content_set_sha256: true
  verify_each_snapshot_sha256: true
  mutable_canonical_raw_read_required: false
execution_boundary:
  network_access_allowed: false
  historical_backfill_allowed: false
  canonical_raw_mutation_allowed: false
