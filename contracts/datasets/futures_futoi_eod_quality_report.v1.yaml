contract_id: futures_futoi_eod_quality_report.v1
dataset_id: futures_futoi_eod_quality_report
artifact_class: state_quality
format: json
schema_version: futures_futoi_eod_quality_report.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/state/quality/dataset_id=futures_futoi_eod/run_date={YYYY-MM-DD}/run_id={RUN_ID}/quality_report.json"
required_fields:
  - run_id
  - dataset_id
  - instrument_id
  - source_id
  - raw_dataset_id
  - raw_manifest_reference
  - raw_content_pin_reference
  - raw_content_pin_sha256
  - content_pin_status
  - requested_from
  - requested_till
  - quality_status
  - raw_partition_count
  - partition_count
  - row_count
  - duplicate_key_count
  - null_required_count
  - invalid_position_count
  - failure_count
  - ambiguity_count
  - failed_dates
  - derivation_id
  - pair_key_fields
  - output_version_mode
  - immutable_output_run_root
  - immutable_output_run_reserved
hard_checks:
  - raw_content_pin_digest_matches_explicit_input
  - content_pin_uses_selected_raw_run_writer_hashes
  - aggregate_raw_manifest_digest_matches_content_pin
  - every_raw_partition_digest_matches_content_pin
  - raw_manifest_and_quality_identity_valid
  - raw_partition_count_positive
  - partition_count_equals_raw_partition_count
  - row_count_equals_two_times_partition_count
  - duplicate_key_count_zero
  - null_required_count_zero
  - invalid_position_count_zero
  - failure_count_zero
  - ambiguity_count_zero
  - failed_dates_empty
  - every_partition_contains_exactly_FIZ_and_YUR
  - selected_FIZ_and_YUR_share_latest_common_trade_date_moment_sess_id_pair
  - selected_group_seqnum_may_differ
  - selected_rows_pos_identity_holds
  - selected_pair_pos_is_zero_sum
  - output_version_mode_is_run_id
  - immutable_output_run_reserved_before_write
  - versioned_output_paths_match_current_run_id
failure_policy: fail_closed
accepted_pointer_update_allowed: false
