source_contract_id: moex_algopack_fo_tradestats_snapshot.v1
artifact_class: external_pattern
producer: future owner-run source snapshot step
consumer: existing single-partition materializer
target_dataset_id: futures_raw_5m
target_contract_id: futures_raw_5m.v1
target_partition:
  trade_date: 2026-06-02
  family: Si
  secid: SiM6
method: GET
endpoint: https://apim.moex.com/iss/datashop/algopack/fo/tradestats/{secid}.json
query_parameters:
  secid: SiM6
  from: 2026-06-02
  till: 2026-06-02
  latest: 0
response_format: ISS-style JSON
primary_table: data
pagination_table: data.cursor
confirmed_row_count: 96
confirmed_row_count_semantics:
  status: diagnostic_evidence_only
  invariant: not_exact_row_count_requirement
  interpretation:
    - confirmed_row_count records earlier diagnostic evidence only
    - confirmed_row_count must not be used as a hard equality invariant for source artifacts
    - lifecycle-aware row_count semantics determine whether observed row_count is acceptable
approved_explicit_source_artifact:
  external_path: /home/trader/moex_bot/data/source_snapshots/moex_algopack_fo_tradestats_snapshot.v1/SiM6_2026-06-02.csv
  row_count: 115
  sha256: a15c3e73ab781b1f327698d7319a294e117b03e1a9efebaad6498e8d4b2e513b
  lifecycle_status: listed_active_with_trades
  materializer_input_status: acceptable_after_schema_identity_hash_manifest_checks
required_source_columns:
  - tradedate
  - tradetime
  - secid
  - asset_code
  - pr_open
  - pr_high
  - pr_low
  - pr_close
  - vol
  - val
  - trades
  - SYSTIME
field_mapping_to_futures_raw_5m:
  instrument_id: forts.test.si
  trade_date: tradedate
  ts: tradedate + tradetime
  session_date: tradedate
  secid: secid
  family: asset_code
  board: RFUD
  market: FORTS
  engine: stock
  source_id: moex_algopack_fo_tradestats_snapshot.v1
  open: pr_open
  high: pr_high
  low: pr_low
  close: pr_close
  volume: vol
  value: val
  num_trades: trades
  source: algopack.fo.tradestats.v1
  ingest_ts: source snapshot creation timestamp
timestamp_semantics:
  - ts is MOEX/MSK exchange-local 5-minute bucket timestamp
  - no UTC conversion in this contract
  - session_date equals tradedate for this single artifact only
pagination_rule:
  - fail closed if data.cursor indicates incomplete pagination
lifecycle_row_count_semantics:
  row_count_interpretation: lifecycle_aware
  lifecycle_statuses:
    - listed_active_with_trades
    - listed_active_no_trades
    - expired_with_history
    - expired_no_data
    - unknown_or_invalid_contract
  listed_active_with_trades:
    - positive row_count is expected
    - row_count=0 fails unless lifecycle evidence is revised to listed_active_no_trades
  listed_active_no_trades:
    - row_count=0 may be acceptable only after schema, partition identity, lifecycle, and manifest evidence are valid
  expired_with_history:
    - positive historical row_count may be acceptable after schema, partition identity, lifecycle, and manifest evidence are valid
  expired_no_data:
    - row_count=0 may be acceptable only when lifecycle evidence confirms no historical data exists for the requested partition
  unknown_or_invalid_contract:
    - fail closed
zero_row_interpretation:
  - row_count=0 is not automatically failure
  - row_count=0 must be interpreted through lifecycle status
  - unknown lifecycle must fail closed
  - ambiguous source response must fail closed
  - unknown_or_invalid_contract with row_count=0 must fail closed
positive_row_count_rules:
  - positive row_count does not by itself authorize materialization
  - positive row_count still requires schema validation
  - positive row_count still requires partition identity validation
  - positive row_count still requires hash and manifest validation
fail_closed_conditions:
  - HTTP status != 200
  - non-JSON response
  - missing required columns
  - unknown lifecycle status
  - ambiguous source response
  - unknown_or_invalid_contract
  - row_count=0 with unknown or ambiguous lifecycle
  - row_count=0 for listed_active_with_trades
  - secid != SiM6
  - asset_code != Si
  - tradedate != 2026-06-02
  - duplicate tradedate + tradetime
  - non-monotonic timestamps
  - null OHLC
  - invalid OHLC
  - negative vol/val/trades
  - incomplete cursor/pagination
  - fallback to ISS candles/RFUD marketdata
  - synthetic/manual row construction
  - latest/current/autodetect dynamic selection
scope_exclusions:
  - this contract does not authorize source artifact creation
  - this contract does not authorize data lake write
  - this contract does not authorize materialization
  - this contract does not authorize strategy/research/runtime/live
execution_guards:
  - no loader implementation is created by this contract
  - no network call is made by this contract
  - no source artifact is created by this contract
  - no data lake write is performed by this contract
  - no materialization is run by this contract
  - no backfill is run by this contract
