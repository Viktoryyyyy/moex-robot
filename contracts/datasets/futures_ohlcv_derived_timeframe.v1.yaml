contract_id: futures_ohlcv_derived_timeframe.v1
dataset_id: futures_ohlcv_derived_timeframe
artifact_class: external_pattern
producer: moex_data.futures.resampling
consumers:
  - moex_features
format: parquet
schema_version: futures_ohlcv_derived_timeframe.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: ${MOEX_DATA_ROOT}/futures/ohlcv_derived/timeframe={TIMEFRAME}/family={FAMILY}/secid={SECID}/board={BOARD}/market={MARKET}/series_type={SERIES_TYPE}/trade_date={TRADE_DATE}/part.parquet
partitioning:
  - TIMEFRAME
  - FAMILY
  - SECID
  - BOARD
  - MARKET
  - SERIES_TYPE
  - TRADE_DATE
allowed_timeframes:
  - 10m
  - 15m
  - 30m
  - 1h
  - 4h
  - 1D
  - 1W
parent_dataset_contract_ref: contracts/datasets/futures_ohlcv_5m.v1.yaml
parent_manifest_required: true
required_identifier_fields:
  - FAMILY
  - SECID
  - BOARD
  - MARKET
  - SERIES_TYPE
