dataset_id: futures_futoi_raw_incremental_acceptance
schema_version: futures_futoi_raw_incremental_acceptance.v1
status: implementation_ready
source_dataset_id: futures_futoi_raw
source_id: moex_algopack_futoi
scope:
  instruments:
    - si_futures_family
    - cr_futures_family
semantics:
  purpose: fail_closed_incremental_acceptance_after_historical_stage2_baseline
  historical_baseline_pointer_mutated: false
  latest_autodetect_allowed: false
  implicit_partition_discovery_allowed: false
  source_materialization_must_be_explicit_date_bounded: true
  validation_reads_exact_descriptor_snapshot_bytes: true
  accepted_raw_uses_immutable_snapshot_bytes: true
  backfill_partition_evidence_is_run_bound: true
  backfill_partition_evidence_uses_materializer_publication_sha256: true
  materializer_publication_sha256_captured_before_atomic_replace: true
  completed_source_date_policy: explicit_date_end_strictly_before_current_europe_moscow_date
  date_source_artifact_id: external.apim.fo.tradestats.v1
  date_source_id: moex_algopack_fo_tradestats_5m
  date_source_endpoint: /iss/datashop/algopack/fo/tradestats.json
  date_selection_rule: observed_trade_dates_only
  observed_date_evidence_run_bound_create_only: true
  weekday_inference_allowed: false
  fabricated_trade_dates_allowed: false
paths:
  immutable_run_root_pattern: ${MOEX_DATA_ROOT}/state/accepted_manifests/futoi_raw_incremental/instrument_id={INSTRUMENT_ID}/run_id={RUN_ID}
  immutable_manifest_pattern: ${MOEX_DATA_ROOT}/state/accepted_manifests/futoi_raw_incremental/instrument_id={INSTRUMENT_ID}/run_id={RUN_ID}/manifest.json
  current_pointer_pattern: ${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_incremental_accepted_manifest.json
acceptance:
  require_parent_accepted_state: true
  require_parent_sha256_binding: true
  require_contiguous_requested_range_from_parent_end_plus_one: true
  require_date_end_strictly_before_current_europe_moscow_date: true
  require_authoritative_observed_date_evidence: true
  require_manifest_and_quality_same_observed_date_evidence_ref_and_sha256: true
  require_observed_date_evidence_stable_non_symlink_snapshot: true
  require_observed_date_evidence_run_range_source_endpoint_reference_secid_validation: true
  require_observed_date_evidence_sorted_unique_nonempty: true
  require_observed_dates_within_requested_range: true
  require_written_partition_trade_dates_exactly_equal_observed_trade_dates: true
  freeze_validated_observed_date_evidence_bytes_create_only: true
  bind_accepted_observed_date_evidence_snapshot_ref_and_sha256: true
  acceptance_network_access_required: false
  require_zero_failed_dates: true
  require_quality_status_pass: true
  require_backfill_manifest_and_quality_run_id_match_requested_run: true
  require_partition_evidence_for_every_written_partition: true
  require_partition_evidence_trade_date_subrun_path_sha256_row_count_binding: true
  require_partition_evidence_sha256_from_materializer_publication: true
  require_all_futures_futoi_raw_contract_columns: true
  revalidate_registry_secid_board_market_engine_source_ticker_binding: true
  require_raw_ts_equal_raw_moment: true
  require_nonnegative_canonical_seqnum: true
  require_finite_position_numerics: true
  require_nonnegative_integer_participant_counts: true
  require_net_position_identity_pos_equals_long_plus_short: true
  require_utc_availability_and_ingest_timestamps: true
  require_publication_availability_ingest_chronology: true
  recompute_partition_quality_from_exact_snapshot: true
  canonicalize_source_key_equivalence_before_duplicate_check: true
  require_zero_duplicate_keys: true
  require_zero_null_required: true
  require_zero_invalid_positions: true
  require_FIZ_and_YUR_in_every_written_partition: true
  reject_partition_symlink_before_resolution: true
  require_partition_sha256_of_validated_bytes: true
  require_partition_sha256_match_run_bound_backfill_evidence: true
  freeze_validated_partition_bytes_create_only: true
  snapshot_parent_and_source_evidence_create_only: true
  atomic_pointer_advance_after_full_validation_only: true
  failed_validation_pointer_advance: false
research_authority:
  historical_pit_research_ready_claimed: false
  directional_signal_authority: false
  trading_action_authority: false
