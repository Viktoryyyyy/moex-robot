dataset_id: futures_futoi_raw_incremental_acceptance
schema_version: futures_futoi_raw_incremental_acceptance.v1
status: implementation_ready
source_dataset_id: futures_futoi_raw
source_id: moex_algopack_futoi
scope:
  instruments:
    - si_futures_family
    - cr_futures_family
semantics:
  purpose: fail_closed_incremental_acceptance_after_historical_stage2_baseline
  historical_baseline_pointer_mutated: false
  latest_autodetect_allowed: false
  implicit_partition_discovery_allowed: false
  source_materialization_must_be_explicit_date_bounded: true
  validation_reads_exact_descriptor_snapshot_bytes: true
  accepted_raw_uses_immutable_snapshot_bytes: true
paths:
  immutable_run_root_pattern: ${MOEX_DATA_ROOT}/state/accepted_manifests/futoi_raw_incremental/instrument_id={INSTRUMENT_ID}/run_id={RUN_ID}
  immutable_manifest_pattern: ${MOEX_DATA_ROOT}/state/accepted_manifests/futoi_raw_incremental/instrument_id={INSTRUMENT_ID}/run_id={RUN_ID}/manifest.json
  current_pointer_pattern: ${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/current_incremental_accepted_manifest.json
acceptance:
  require_parent_accepted_state: true
  require_parent_sha256_binding: true
  require_contiguous_calendar_request_from_parent_end_plus_one: true
  allow_empty_source_dates_only_when_declared_skipped: true
  require_zero_failed_dates: true
  require_quality_status_pass: true
  require_all_futures_futoi_raw_contract_columns: true
  revalidate_registry_secid_board_market_engine_source_ticker_binding: true
  require_utc_availability_and_ingest_timestamps: true
  recompute_partition_quality_from_exact_snapshot: true
  require_zero_duplicate_keys: true
  require_zero_null_required: true
  require_zero_invalid_positions: true
  require_FIZ_and_YUR_in_every_written_partition: true
  reject_partition_symlink_before_resolution: true
  require_partition_sha256_of_validated_bytes: true
  freeze_validated_partition_bytes_create_only: true
  snapshot_parent_and_source_evidence_create_only: true
  atomic_pointer_advance_after_full_validation_only: true
  failed_validation_pointer_advance: false
research_authority:
  historical_pit_research_ready_claimed: false
  directional_signal_authority: false
  trading_action_authority: false
