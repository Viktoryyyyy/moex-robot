contract_id: futures_open_interest_raw_5m.v1
dataset_id: futures_open_interest_raw_5m
artifact_class: external_pattern
producer: moex_data.futures.materialize_open_interest_instrument
consumers:
  - moex_data.step3_raw_pilot_runner
  - moex_data.futures.continuous_series_builder
format: parquet
schema_version: futures_open_interest_raw_5m.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/supplementary/dataset_id=futures_open_interest_raw_5m/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
partitioning:
  - dataset_id
  - instrument_id
  - trade_date
  - source_id
grain: 5m_open_interest_bar
primary_key:
  - instrument_id
  - ts
  - source_id
required_columns:
  - instrument_id
  - trade_date
  - ts
  - secid
  - board
  - market
  - engine
  - source_id
  - oi_open
  - oi_high
  - oi_low
  - oi_close
  - source
  - ingest_ts
source_contract_ref: contracts/sources/futures/moex_algopack_fo_open_interest_5m.v1.yaml
quality_checks:
  - non_null_oi
  - oi_high_ge_oi_low
  - oi_open_close_inside_range
  - non_negative_oi
  - duplicate_instrument_ts_source_count
  - monotonic_ts
accepted_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/dataset_id=futures_open_interest_raw_5m/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
path_rules:
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
retention_policy: keep_all_valid_partitions
