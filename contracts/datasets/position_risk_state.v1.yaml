contract_id: position_risk_state.v1
status: implementation_candidate
purpose: >
  Canonical explicit position/risk snapshot for the RUB forecasting workflow. The
  contract validates user-entered or read-only broker-export state and derives
  only deterministic arithmetic risk aggregates. It does not place orders, size
  positions, or invent instrument payout mechanics.

input_contract:
  schema_version: step8_position_risk_input.v1
  source_modes:
    - manual
    - read_only_broker_export
  account_currency: RUB
  required_account_fields:
    - free_funds_rub
    - current_initial_margin_rub
    - variation_margin_rub
    - liquidity_buffer_rub
    - max_total_contracts
    - max_allowed_loss_rub
  required_position_fields:
    - position_id
    - instrument_id
    - expiry
    - contracts
    - average_price
    - fills
    - commission_total_rub
    - realized_pnl_rub
    - unrealized_pnl_rub
    - horizon
    - invalidation
    - protective_stop
    - tranches
  expiry_policy:
    strict_iso_date_when_present: true
    null_allowed_with_explicit_reason: true
  timestamp_policy:
    utc_only: true
    fractional_seconds_preserved: true
    output_offset: "+00:00"
  numeric_precision_policy:
    binary_float_direct_inputs_rejected: true
    json_decimal_tokens_parsed_as_decimal: true
    supplied_decimal_precision_preserved: true
    exact_decimal_aggregation_without_default_context_rounding: true
  string_fields_strict_type: true
  safe_token_pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
  signed_contracts_required: true
  all_numeric_values_finite: true
  decimal_money_serialization: canonical_decimal_string
  empty_positions_allowed: true
  zero_limits_allowed: true
  scenario_grid_required:
    - usd_rub_minus_5
    - usd_rub_minus_3
    - usd_rub_minus_1
    - usd_rub_plus_1
    - usd_rub_plus_3
    - usd_rub_plus_5
    - gap
  list_order_policy: preserve_supplied_order

fill_reconciliation_contract:
  fills_are_complete_for_each_open_position: true
  signed_fill_contracts_formula: sum_signed_fill_contracts_equals_position_contracts
  commission_formula: sum_fill_commission_rub_equals_commission_total_rub
  tolerance_rub: 0
  fill_contract_sum_is_diagnostic_only: true
  fill_commission_sum_rub_is_diagnostic_only: true
  position_contracts_recomputed_from_fills: false
  commission_total_recomputed_from_fills: false

calculation_contract:
  exact_derived_fields:
    - current_gross_contracts
    - current_contract_headroom
    - current_contract_limit_breach
    - planned_conservative_additional_gross_contracts
    - planned_conservative_gross_contracts
    - planned_conservative_contract_headroom
    - planned_conservative_contract_limit_breach
    - total_invalidation_loss_rub
    - invalidation_loss_headroom_rub
    - invalidation_loss_limit_breach
    - worst_supplied_scenario_pnl_rub
    - best_supplied_scenario_pnl_rub
    - worst_supplied_scenario_loss_rub
    - scenario_loss_headroom_rub
    - scenario_loss_limit_breach
    - liquidity_buffer_breach
    - total_commission_rub
    - total_realized_pnl_rub
    - total_unrealized_pnl_rub
  current_gross_contracts_formula: sum_abs_signed_position_contracts
  planned_conservative_gross_formula: current_gross_plus_sum_abs_all_planned_contract_deltas
  planned_conservative_semantics: >
    Every supplied tranche delta contributes its absolute contract count, including
    reducing or closing deltas. This intentionally overstates possible gross exposure
    and must not be interpreted as an execution sequence or auto-sizing policy.
  invalidation_loss_formula: sum_supplied_nonnegative_position_invalidation_loss_rub
  worst_scenario_formula: minimum_of_supplied_six_standard_scenarios_and_gap_pnl
  best_scenario_formula: maximum_of_supplied_six_standard_scenarios_and_gap_pnl
  breach_thresholds:
    contract_headroom_negative: true
    invalidation_loss_headroom_negative: true
    scenario_loss_headroom_negative: true
    liquidity_buffer_negative: true

pnl_provenance_policy:
  realized_pnl_recomputed: false
  unrealized_pnl_recomputed: false
  invalidation_loss_recomputed_from_price: false
  scenario_pnl_recomputed_from_market_move: false
  supplied_pnl_fields_are_external_evidence: true
  instrument_payout_mapping_required_before_pnl_recalculation: true

safety_policy:
  broker_write_access_used: false
  automatic_order_placement_allowed: false
  automatic_position_sizing_allowed: false
  trade_recommendation_generated: false
  stop_or_invalidation_generation_allowed: false
  tranche_generation_allowed: false

fail_closed_policy:
  unknown_input_keys_rejected: true
  duplicate_json_object_members_rejected: true
  non_string_text_fields_rejected: true
  unsafe_identifier_tokens_rejected: true
  nonfinite_numeric_values_rejected: true
  binary_float_coercion_rejected: true
  unsupported_source_modes_rejected: true
  duplicate_position_ids_rejected: true
  duplicate_instrument_expiry_positions_rejected: true
  duplicate_fill_ids_within_position_rejected: true
  zero_position_contracts_rejected: true
  zero_fill_contracts_rejected: true
  zero_tranche_contract_delta_rejected: true
  non_utc_snapshot_and_fill_timestamps_rejected: true
  invalid_expiry_dates_rejected: true
  incomplete_or_extra_scenario_keys_rejected: true
  fill_contract_mismatch_rejected: true
  fill_commission_mismatch_rejected: true

unresolved_dependencies:
  instrument_payout_and_lot_mapping:
    status: required_before_price_based_pnl_recalculation
  broker_ingest_adapter:
    status: optional_read_only_adapter_not_implemented
  persistent_current_pointer:
    status: deferred_until_snapshot_acceptance_policy_is_approved
  daily_weekly_bundle_join:
    status: stage9_dependency
