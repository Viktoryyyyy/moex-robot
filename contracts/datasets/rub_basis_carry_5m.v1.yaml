contract_id: rub_basis_carry_5m.v1
dataset_id: rub_basis_carry_5m
artifact_class: external_pattern
producer: moex_data.analytics.materialize_rub_basis_carry_5m
producer_ref: src/moex_data/analytics/materialize_rub_basis_carry_5m.py
format: parquet
schema_version: rub_basis_carry_5m.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/market/derived/dataset_id=rub_basis_carry_5m/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/part.parquet"
partitioning:
  - dataset_id
  - instrument_id
  - trade_date
grain: exact_common_5m_timestamp
identity_model:
  canonical_identity_field: instrument_id
  instrument_ids:
    - usd_rub_basis_carry
    - cny_rub_basis_carry
  pair_id_is_descriptive_not_partition_identity: true
primary_key:
  - instrument_id
  - ts
required_columns:
  - instrument_id
  - pair_id
  - trade_date
  - ts
  - spot_rate
  - perpetual_rate
  - front_rate
  - next_rate
  - perpetual_secid
  - front_secid
  - next_secid
  - front_expiry_date
  - next_expiry_date
  - calendar_days_to_front_expiry
  - calendar_days_to_next_expiry
  - calendar_days_between_expiries
  - perpetual_spot_basis_abs
  - perpetual_spot_basis_bps
  - front_spot_basis_abs
  - front_spot_basis_bps
  - next_spot_basis_abs
  - next_spot_basis_bps
  - front_perpetual_basis_abs
  - front_perpetual_basis_bps
  - next_perpetual_basis_abs
  - next_perpetual_basis_bps
  - front_next_spread_abs
  - front_next_spread_bps
  - front_spot_implied_carry_annualized
  - next_spot_implied_carry_annualized
  - front_next_term_carry_annualized
  - alignment_policy
  - build_ts
input_contract_refs:
  futures_quotes: contracts/datasets/futures_raw_5m.v1.yaml
  cets_tom: contracts/datasets/fx_spot_raw_5m.v1.yaml
  front_next_mapping: contracts/sources/futures/roll_expiry_mapping.v1.yaml
normalization_policy:
  usd_rub_basis_carry:
    si_front_next_price_divisor: 1000.0
    target_unit: RUB_per_USD
  cny_rub_basis_carry:
    cr_front_next_price_divisor: 1.0
    target_unit: RUB_per_CNY
alignment_policy:
  mode: exact_timestamp_inner_join
  forward_fill_allowed: false
  backward_fill_allowed: false
  asof_join_allowed: false
  nearest_join_allowed: false
  empty_intersection: fail_closed
calculation_policy:
  basis_bps_formula: ((comparison_rate / reference_rate) - 1) * 10000
  annualization_basis_days: 365
  front_spot_implied_carry_formula: ((front_rate / spot_rate) - 1) * 365 / calendar_days_to_front_expiry
  next_spot_implied_carry_formula: ((next_rate / spot_rate) - 1) * 365 / calendar_days_to_next_expiry
  front_next_term_carry_formula: ((next_rate / front_rate) - 1) * 365 / calendar_days_between_expiries
  fair_value_model_claimed: false
  metric_semantics: market_implied_carry_proxy
quality_checks:
  - nonzero_row_count
  - exact_input_timestamp_intersection
  - unique_instrument_ts
  - monotonic_ts
  - positive_normalized_rates
  - non_null_derived_metrics
  - front_expiry_not_before_trade_date
  - next_expiry_after_front_expiry
  - no_forward_fill
  - no_asof_join
accepted_pointer_path_contract: "${MOEX_DATA_ROOT}/state/datasets/dataset_id=rub_basis_carry_5m/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
  dynamic_scan_allowed: false
retention_policy: keep_all_accepted_partitions
