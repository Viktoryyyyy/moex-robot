contract_id: forts_raw_5m_multi_instrument_onboarding.v1
schema_version: data_asset_onboarding_contract.v1
status: active_stage2_canonical
canonical_runbook_ref: docs/data/moex_market_data_ingestion_runbook.v1.md
architecture_contract_ref: contracts/architecture/moex_data_access_canon_v1.yaml
data_lake_config_ref: configs/datasets/futures_data_lake.v1.yaml
instrument_registry_ref: configs/instruments/forts_instrument_registry.v1.yaml
scope:
  quotes_dataset_id: futures_raw_5m
  quotes_dataset_contract_ref: contracts/datasets/futures_raw_5m.v1.yaml
  quotes_source_id: moex_algopack_fo_tradestats_5m
  quotes_source_contract_ref: contracts/sources/futures/moex_algopack_fo_tradestats_5m.v1.yaml
  futoi_dataset_id: futures_futoi_raw
  futoi_dataset_contract_ref: contracts/datasets/futures_futoi_raw.v1.yaml
  futoi_source_id: moex_algopack_futoi
  futoi_source_contract_ref: contracts/sources/futures/moex_algopack_futoi.v1.yaml
identity_rules:
  canonical_identity_field: instrument_id
  explicit_source_id_required: true
  explicit_secid_required_for_quotes: true
  exact_registry_ticker_required_for_futoi: true
  family_as_storage_identity_allowed: false
  latest_autodetect_allowed: false
  implicit_contract_selection_allowed: false
  automatic_roll_selection_allowed_in_stage2: false
canonical_storage:
  quotes_path: "${MOEX_DATA_ROOT}/market/raw/timeframe=5m/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
  futoi_path: "${MOEX_DATA_ROOT}/market/supplementary/dataset_id=futures_futoi_raw/instrument_id={INSTRUMENT_ID}/trade_date={YYYY-MM-DD}/source={SOURCE_ID}/part.parquet"
  accepted_pointer_path: "${MOEX_DATA_ROOT}/state/datasets/dataset_id={DATASET_ID}/instrument_id={INSTRUMENT_ID}/current_accepted_manifest.json"
  secid_pointer_partition_allowed: false
  artifact_id_pointer_partition_allowed: false
stage2_registry_scope:
  - instrument_id: usdrubf_futures_family
    quotes_secid: USDRUBF
    quote_role: historical_core
    futoi_ticker: usdrubf
  - instrument_id: cnyrubf_futures_family
    quotes_secid: CNYRUBF
    quote_role: historical_core
    futoi_ticker: cnyrubf
  - instrument_id: si_futures_family
    quotes_secid: SiU6
    quote_role: reference
    futoi_ticker: si
  - instrument_id: cr_futures_family
    quotes_secid: CRU6
    quote_role: reference
    futoi_ticker: cr
required_registry_fields:
  - instrument_id
  - canonical_symbol
  - display_name
  - source_system
  - source_id
  - market
  - board
  - engine
  - secid
  - source_artifact_id
  - raw_5m_artifact_id
  - enabled_for_loading
  - enabled_for_update
  - enabled_for_retrieval
  - enabled_for_raw_5m_materialization
  - enabled_for_d1_derivation
  - enabled_for_research
  - storage_partition_values.instrument_id
  - storage_partition_values.secid
  - evidence_status
quotes_producers:
  one_date: moex_data.futures.materialize_forts_raw_5m_instrument
  controlled_historical_range: moex_data.futures.backfill_stage2_forts_raw_5m_instrument
futoi_producers:
  one_date: moex_data.futures.materialize_futoi_instrument
  controlled_historical_range: moex_data.futures.backfill_futoi_instrument
new_instrument_onboarding_sequence:
  - step_id: prove_source_identity_and_availability
    required: true
    exit_criteria:
      - exact source identity proven
      - exact SECID or FUTOI ticker proven
      - approved source contract applies
  - step_id: add_registry_entry
    required: true
    instruction: Add explicit source-proven registry binding while all generic execution flags remain false.
  - step_id: run_one_date_canonical_pilot
    required: true
    exit_criteria:
      - canonical market path used
      - partition schema matches dataset contract
      - manifest exists
      - quality report exists and passes
      - latest_autodetect_used is false
  - step_id: validate_pilot_and_promote_evidence
    required: true
    exit_criteria:
      - identity and metadata match registry/contracts
      - global runtime enablement remains false
  - step_id: run_authorized_historical_backfill
    required_when_scope_authorized: true
    scope_authority_ref: configs/datasets/futures_data_lake.v1.yaml
    exit_criteria:
      - range explicit and source-proven
      - source/network/schema failures fail closed
      - non-trading empty-source dates explicitly reconciled
      - all writes use canonical market path
  - step_id: run_full_physical_acceptance_audit
    required_when_backfilled: true
    exit_criteria:
      - no bad partitions
      - duplicate/null/sign/OHLC checks pass as applicable
      - requested range reconciles to written plus explicit skipped dates
  - step_id: create_accepted_pointer
    required_after_explicit_acceptance_authority: true
    exit_criteria:
      - aggregate refresh succeeded
      - quality passed
      - pointer uses dataset_id plus instrument_id only
  - step_id: observed_source_refresh_and_scheduler
    separate_later_workstream: true
    required_incremental_mode: observed-source
reference_quote_policy:
  instrument_ids:
    - si_futures_family
    - cr_futures_family
  secids:
    - SiU6
    - CRU6
  multi_year_fixed_contract_backfill_required: false
  automatic_roll_selection_allowed: false
  continuous_history_requires_separate_roll_chain_workstream: true
futoi_policy:
  transport: authenticated_apim_only
  public_iss_transport_allowed: false
  public_iss_fallback_allowed: false
  latest_for_raw_history: 0
  canonical_ts: source_reference_moment
  source_publication_metadata: systime
  raw_source_record_key_fields:
    - trade_date
    - sess_id
    - seqnum
    - secid
    - clgroup
  final_eod_refetch_with_latest_1_allowed: false
  final_eod_derivation_rule: derive_from_canonical_raw_source_record_history_under_separate_contract
acceptance_guards:
  future_chat_can_onboard_from_contract: true
  canonical_runbook_required: true
  latest_glob_autodetect_allowed: false
  new_write_to_legacy_forts_root_allowed: false
  new_write_to_legacy_futures_root_allowed: false
  quotes_and_futoi_share_partition_file_allowed: false
  server_filesystem_as_architecture_proof_allowed: false
