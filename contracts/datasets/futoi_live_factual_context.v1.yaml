dataset_id: futoi_live_factual_context
schema_version: futoi_live_factual_refresh_source_native.v1
status: implementation_ready_runtime_acceptance_pending
producer: moex_data.futures.futoi_live_factual_refresh_source_native.v1
source_id: moex_algopack_futoi
instrument_ids:
  - si_futures_family
  - cr_futures_family
source_identity_registry_ref: configs/instruments/forts_instrument_registry.v1.yaml
source_dataset_ref: contracts/datasets/futures_futoi_raw.v1.yaml
source_contract_ref: contracts/sources/futures/moex_algopack_futoi.v1.yaml
paths:
  si_futures_family: ${MOEX_DATA_ROOT}/state/datasets/dataset_id=futoi_live_factual_context/instrument_id=si_futures_family/current.json
  cr_futures_family: ${MOEX_DATA_ROOT}/state/datasets/dataset_id=futoi_live_factual_context/instrument_id=cr_futures_family/current.json

semantics:
  purpose: factual_only_live_context_for_rub_analysis_snapshot
  per_instrument_artifacts_required: true
  cross_instrument_substitution_allowed: false
  stage5_full_mode_required: false
  stage5_full_mode_ready: false
  stage5_pointer_promotion_allowed: false
  directional_interpretation_allowed: false
  action_generation_allowed: false
  standalone_buy_sell_authority_allowed: false
  missing_or_failed_source_interpreted_as_neutral: false
  source_short_positions_are_signed_negative: true
  exposed_short_positions_are_absolute_contract_counts: true
  exact_fiz_yur_alignment_required: true
  shared_fiz_yur_sess_id_required: true
  alignment_rule: latest_exact_shared_source_event_ts_and_sess_id_after_max_seqnum_revision_resolution
  multi_sess_id_same_group_event: fail_closed
  cross_sess_id_fiz_yur_pair: fail_closed
  ambiguous_max_seqnum: fail_closed
  fiz_yur_net_must_balance_zero: true
  total_long_must_equal_total_short_abs: true
  source_event_timezone: Europe/Moscow
  snapshot_ts_representation: UTC_ISO8601_offset_aware
  source_publication_time_representation: UTC_ISO8601_offset_aware
  availability_ts_representation: UTC_ISO8601_offset_aware
  ingest_ts_representation: UTC_ISO8601_offset_aware
  data_as_of_equals_factual_snapshot_ts: true

freshness:
  calendar_dependency: false
  moex_calendar_api_allowed: false
  trading_date_authority: moex_algopack_fo_tradestats_5m
  observed_date_resolver: moex_data.futures.observed_tradestats_dates.observed_dates
  source_lookback_days: 14
  policy: bounded_observed_tradestats_dates_then_exact_futoi
  exact_date_requests_only: true
  implicit_latest_endpoint_semantics_allowed: false
  weekday_weekend_inference_allowed: false
  empty_futoi_on_observed_trade_date: fail_closed
  observed_date_source_failure: fail_closed
  transport_auth_parse_error: fail_closed
  malformed_nonempty_source_date: fail_closed
  stale_as_neutral_allowed: false

required_top_level_fields:
  - schema_version
  - project
  - status
  - source_id
  - instrument_id
  - run_id
  - through_date
  - expected_latest_source_trade_date
  - data_as_of
  - last_success_at
  - freshness
  - source_date_observations
  - quality_status
  - acceptance_status
  - factual
  - provenance
  - factual_authority
  - directional_authority
  - action_authority
  - standalone_buy_sell_authority
  - stage5_full_mode_ready
  - stage5_pointer_promotion_performed

factual_fields:
  required:
    - trade_date
    - snapshot_ts
    - source_publication_time
    - availability_ts_utc
    - ingest_ts_utc
    - source_ticker
    - secid
    - sess_id
    - fiz
    - yur
    - total_open_interest
    - short_semantics
    - timestamp_semantics
    - fiz_yur_alignment
  side_fields:
    - long
    - short
    - net
    - long_participants
    - short_participants

provenance:
  accepted_state_kind_required: true
  allowed_accepted_state_kinds:
    - source_native_exact_date_raw_quality_pass
  immutable_raw_partition_sha256_required: true
  raw_quality_report_sha256_required: true
  raw_refresh_manifest_sha256_required: true
  source_contract_ref_required: true
  raw_contract_ref_required: true
  raw_producer_required: true
  cumulative_incremental_acceptance_required_for_current_factual_context: false
  historical_stage5_promotion_required: false

failure_semantics:
  raw_refresh_or_quality_failure: fail_instrument_component_only
  empty_futoi_on_authoritative_observed_trade_date: fail_instrument_component_only
  source_probe_transport_auth_parse_failure: fail_instrument_component_only
  all_instrument_failures_aggregate_status: FAILED
  mixed_instrument_results_aggregate_status: PARTIAL_FAILURE
  stage7_refresh_blocked_by_futoi_failure: false
  factual_authority_before_governance_live_acceptance: false
  directional_authority: false
  action_authority: false
  standalone_buy_sell_authority: false
