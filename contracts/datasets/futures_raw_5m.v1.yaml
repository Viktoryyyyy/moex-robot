contract_id: futures_raw_5m.v1
dataset_id: futures_raw_5m
artifact_class: external_pattern
producer: moex_data.futures.raw_5m_loader
consumers:
  - moex_data.futures.resampler
  - moex_data.futures.quality_report_builder
format: parquet
schema_version: futures_raw_5m.v1
storage_root_ref: MOEX_DATA_ROOT
path_pattern: "${MOEX_DATA_ROOT}/futures/raw_5m/trade_date={YYYY-MM-DD}/family={FAMILY}/secid={SECID}/part.parquet"
partitioning:
  - trade_date
  - family
  - secid
grain: 5m_bar
primary_key:
  - ts
  - secid
required_columns:
  - trade_date
  - ts
  - session_date
  - secid
  - family
  - board
  - open
  - high
  - low
  - close
  - volume
  - value
  - num_trades
  - source
  - ingest_ts
controlled_native_5m_materialization:
  producer: moex_data.futures.materialize_raw_5m
  source_candidate: MOEX_ALGOPACK_FO_TRADESTATS
  source_endpoint: /iss/datashop/algopack/fo/tradestats.json
  endpoint_base_env_var: MOEX_API_URL
  fallback_endpoints_allowed: false
  market: FORTS
  board: RFUD
  family: Si
  secid: SiM6
  trade_date_binding: explicit_cli_argument
  example_trade_date: "2026-06-02"
  granularity: 5m
  series_type: native
  query_params:
    date: "{YYYY-MM-DD}"
    from: "{YYYY-MM-DD}"
    till: "{YYYY-MM-DD}"
    secid: SiM6
    start: "0"
    iss.meta: "off"
    iss.only: tradestats
  required_contract_inputs:
    - MOEX_DATA_ROOT
    - market
    - board
    - family
    - secid
    - trade_date
    - series_type
    - granularity
    - source_candidate
    - source_endpoint
    - raw_manifest_ref
    - raw_quality_report_ref
  failure_semantics:
    empty_response: fail_closed
    schema_mismatch: fail_closed
    missing_required_contract_input: fail_closed
    implicit_fallback: forbidden
    iss_candles_masking: forbidden
quality_checks:
  - non_null_ohlc
  - high_ge_low
  - open_high_low_close_inside_range
  - duplicate_ts_secid_count
  - monotonic_ts_by_secid
path_rules:
  storage_root: env_contract
  hardcoded_server_path_allowed: false
  implicit_file_selection_allowed: false
retention_policy: keep_all_valid_partitions
