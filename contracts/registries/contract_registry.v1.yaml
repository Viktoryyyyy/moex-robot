# Authoritative Contract Registry (v1)
#
# This file is the authoritative index of all contract artifacts in the
# repository. It is the single source of truth for locating, versioning and
# resolving contract artifacts. Later Phase 2A batches will populate the
# remaining artifacts incrementally; this skeleton seeds representative
# entries across multiple categories using evidence from the Phase 1 audit.
#
# Status vocabulary (exactly one of):
#   active      - currently authoritative and in force
#   superseded  - replaced by a newer contract; retained for history
#   deprecated  - no longer recommended; retained for history
#   historical  - no longer in force; retained for audit/history only
#
# Required fields per entry:
#   contract_id          - stable unique identifier for the contract
#   canonical_path       - repo-relative path to the authoritative artifact
#   version              - contract version (e.g. v1)
#   scope                - category/lane (architecture, datasets, runtime,
#                          experiments, features, instruments, registries, ...)
#   supersedes           - contract_id(s) this entry replaces (empty if none)
#   superseded_by        - contract_id(s) that replace this entry (empty if none)
#   implementation_refs  - repo-relative paths to implementation artifacts
#   enforcement_test_refs - repo-relative paths to enforcement/validation tests
#   authority            - authority/runtime notes for this contract
#   duplicate_overlap_notes - notes on YAML/MD overlap resolution (see README)

schema_version: contract_registry.v1
registry_kind: contract
artifact_class: repo_relative
status_vocabulary:
  - active
  - superseded
  - deprecated
  - historical

