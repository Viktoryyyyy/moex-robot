contract_id: futures.roll_expiry_mapping.v1
status: implementation_pending_physical_pilot
artifact_kind: source_identity_contract
source_family: futures.roll_expiry_mapping
instrument_scope:
  - Si
  - CR
implementation_ref: src/moex_data/futures/front_next_binding.py

required_source_metadata:
  - root
  - secid
  - expiration_date
  - last_trade_date
  - available_from
  - as_of

selection_policy:
  explicit_root_required: true
  explicit_as_of_required: true
  latest_autodetect_allowed: false
  implicit_contract_selection_allowed: false
  liquidity_based_selection_allowed: false
  future_data_selection_allowed: false
  eligibility:
    - available_from <= as_of
    - last_trade_date >= as_of
  deterministic_order:
    - expiration_date ascending
    - last_trade_date ascending
    - secid ascending
  front: first eligible explicit contract
  next: second eligible explicit contract
  ambiguity: fail_closed
  fewer_than_two_contracts: fail_closed

point_in_time_rules:
  mapping_metadata_must_be_available_by_as_of: true
  post_as_of_revision_may_not_rewrite_prior_binding: true
  unknown_availability: fail_closed

current_identity_evidence:
  as_of: "2026-08-24"
  Si:
    front: SiU6
    next: SiZ6
    physical_binding_validation_pending: true
  CR:
    front: CRU6
    next: CRZ6
    physical_binding_validation_pending: true

readiness_flags:
  repository_implementation_ready: true
  source_identity_contract_ready: true
  physical_pilot_passed: false
  accepted_pointer_ready: false
  continuous_series_ready: false
  research_ready: false

explicit_non_authorizations:
  - no continuous contract materialization
  - no automatic liquidity roll
  - no future optimized roll
  - no server acceptance claim before physical pilot
