contract_id: futures.roll_expiry_mapping.v1
status: active_stage3_candidate
artifact_kind: deterministic_source_binding_contract
source_family: futures.roll_expiry_mapping
instrument_scope:
  - Si
  - CR

purpose: >
  Deterministically bind explicit front and next FORTS contracts for Si and CR
  from the official MOEX ISS instrument reference. The binding step produces
  explicit SECIDs which downstream materializers must receive as arguments.

reference_source:
  source_id: moex_iss_forts_securities_reference
  endpoint_path: /iss/engines/futures/markets/forts/securities.json
  engine: futures
  market: forts
  board: RFUD
  transport: public_iss
  required_columns:
    - SECID
    - BOARDID
    - LASTTRADEDATE

binding_inputs:
  explicit_as_of_date_required: true
  explicit_root_required: true
  allowed_roots:
    Si:
      secid_prefix: Si
      contract_month_codes: [H, M, U, Z]
    CR:
      secid_prefix: CR
      contract_month_codes: [H, M, U, Z]

binding_rule:
  1_filter_board: BOARDID == RFUD
  2_filter_root: SECID matches exact configured root prefix plus quarterly month code and one year digit
  3_filter_alive: LASTTRADEDATE >= explicit as_of_date
  4_sort: LASTTRADEDATE ascending, then SECID ascending
  5_front: first row
  6_next: second row
  require_two_distinct_contracts: true
  output_fields:
    - root
    - as_of_date
    - role
    - secid
    - last_trade_date
    - source_id

canonical_time_fields:
  mapping_fixed_ts_utc:
    required_for_research_use: true
    timezone: UTC
    source: deterministic_binding_execution_audit
  availability_ts_utc:
    required_for_research_use: true
    timezone: UTC
    source: source_publication_or_binding_audit
  forecast_anchor_ts:
    timezone: UTC
    local_anchor: "06:00 Europe/Moscow"
  timezone_conversion_to_utc_required: true

point_in_time_rules:
  binding_as_of_date_is_explicit: true
  latest_autodetect_allowed: false
  implicit_contract_selection_allowed: false
  post_as_of_volume_selection_allowed: false
  post_as_of_open_interest_selection_allowed: false
  future_return_optimized_roll_allowed: false
  availability_eligibility_rule: availability_ts_utc <= forecast_anchor_ts
  unknown_or_unresolved_availability_timestamp_rule: >
    If mapping_fixed_ts_utc or availability_ts_utc is unknown or unresolved,
    exclude the binding from that forecast anchor or shift its eligibility by
    at least one trading day. Never infer an earlier availability timestamp.
  revision_policy: >
    A changed mapping requires point-in-time revision history. A later revision
    must not be retroactively applied to an earlier forecast anchor.

materialization_boundary:
  discovery_does_not_write_quote_data: true
  downstream_secid_must_equal_binding_output: true
  downstream_instrument_role_ids:
    Si:
      front: si_front_contract
      next: si_next_contract
    CR:
      front: cr_front_contract
      next: cr_next_contract

readiness_flags:
  deterministic_binding_implemented: true
  physical_pilot_required: true
  continuous_series_ready: false
  research_ready: false

explicit_non_authorizations:
  - no continuous contract construction in Step 3
  - no liquidity-optimized roll rule
  - no implicit latest contract
  - no research/modeling use before physical acceptance
