contract_id: futures.roll_expiry_mapping.v1
status: design_only
lane: ema_3_19_ai
artifact_kind: source_placeholder_contract
source_family: futures.roll_expiry_mapping
instrument_scope:
  - USDRUBF
  - Si

readiness_flags:
  design_only: true
  ingestion_ready: false
  runtime_ready: false
  loader_ready: false
  materialization_ready: false
  feature_computation_ready: false
  modeling_ready: false
  registry_mutation_ready: false
  provider_approved_for_ingestion: false
  provider_approved_for_runtime: false
  provider_approved_for_modeling: false

purpose: >
  Design-only deterministic roll and expiry mapping placeholder for future
  USDRUBF / Si daily phase research alignment. This file does not mutate any
  registry or runtime continuous-contract configuration.

required_mapping_fields:
  - continuous_symbol
  - contract_code
  - trade_date
  - expiry_date
  - roll_effective_date
  - mapping_fixed_ts_utc
  - availability_ts_utc
  - mapping_rule_id
  - source_id

canonical_time_fields:
  mapping_fixed_ts_utc:
    required: true
    timezone: UTC
    source: deterministic_mapping_policy_audit
  availability_ts_utc:
    required: true
    timezone: UTC
    source: mapping_fixed_ts_utc_or_later_publication_audit
  forecast_anchor_ts:
    timezone: UTC
    local_anchor: "06:00 Europe/Moscow"
  timezone_conversion_to_utc_required: true

point_in_time_rules:
  eligibility_rule: availability_ts_utc <= forecast_anchor_ts
  fixed_before_anchor_requirement: >
    The mapping for any forecast anchor must be fixed before that anchor.
    Mapping changes decided after the forecast anchor cannot be applied
    retroactively to that anchor.
  unknown_timestamp_rule: >
    If mapping_fixed_ts_utc or availability_ts_utc is unknown, exclude the row
    or shift by at least one trading day.
  revision_policy: >
    Mapping revisions require PIT revision history. Without it, revisions cannot
    be applied to earlier anchors.

prohibited_roll_decisions:
  - future liquidity optimized roll date
  - future return optimized roll date
  - future slippage optimized roll date
  - future model-performance optimized roll date
  - roll choice selected using post-anchor volume outcomes
  - roll choice selected using post-anchor open-interest outcomes

allowed_design_principle: >
  A later implementation must use a deterministic rule fixed before the affected
  forecast anchor and documented as point-in-time safe.

excluded_input_fields:
  - B/S/OUT labels
  - EMA cross labels
  - future returns
  - future volatility
  - drawdown
  - phase-completion targets
  - LLM classifications
  - post-fact annotations
  - realized event outcomes

explicit_non_authorizations:
  - no registry mutation
  - no configs mutation
  - no src implementation
  - no tests
  - no ingestion
  - no backfill
  - no materialization
  - no runtime
  - no feature computation
  - no modeling
  - no server apply
