contract_id: moex_algopack_futoi.v1
schema_version: source_contract.v1
status: active_stage2_proven
source_id: moex_algopack_futoi
source_system: moex_algopack
source_kind: supplementary_futoi
engine: futures
market: forts
board: RFUD
endpoint_id: algopack_futoi
endpoint_pattern: /iss/analyticalproducts/futoi/securities/{TICKER}.json
base_url_env: MOEX_API_URL
default_base_url: https://apim.moex.com
auth:
  type: bearer
  token_env: MOEX_API_KEY
  token_required_for_apim: true
request_contract:
  explicit_fields:
    from: "{YYYY-MM-DD}"
    till: "{YYYY-MM-DD}"
    latest: "0"
  pagination_field: start
  response_block: futoi
  latest_autodetect_allowed: false
  fallback_endpoint_allowed: false
  public_iss_transport_allowed: false
  retry_policy:
    max_attempts: 3
    retry_http_status:
      - 401
      - 429
      - 500
      - 502
      - 503
      - 504
response_contract:
  canonical_dataset_ref: contracts/datasets/futures_futoi_raw.v1.yaml
  availability_evidence_ref: configs/instruments/forts_instrument_registry.v1.yaml
  required_columns:
    - sess_id
    - seqnum
    - tradedate
    - tradetime
    - ticker
    - clgroup
    - pos
    - pos_long
    - pos_short
    - pos_long_num
    - pos_short_num
    - systime
  raw_validation:
    before_normalization_required: true
    duplicate_case_normalized_columns_forbidden: true
    canonicalize_unique_source_columns_to_lowercase: true
    exact_requested_trade_date_required: true
    exact_registry_ticker_required: true
    source_identifier_fields:
      - sess_id
      - seqnum
    source_identifier_semantics: finite_integral_non_boolean
    exact_integer_precision_required: true
    supported_clgroups:
      - FIZ
      - YUR
  timestamp_semantics:
    canonical_ts_source_fields:
      - tradedate
      - tradetime
    canonical_ts_meaning: time_of_last_trade_included_in_calculation
    source_publication_field: systime
    source_publication_meaning: moex_source_publication_metadata
    historical_systime_identity_allowed: false
    historical_systime_note: archival APIM history may carry a common later systime across many historical source records
    source_reference_date_must_equal_trade_date: true
    publication_must_not_precede_source_reference_time: true
    seqnum_meaning: technical_data_package_number
  duplicate_policy:
    source_record_key_fields:
      - trade_date
      - sess_id
      - seqnum
      - secid
      - clgroup
    exact_duplicate_same_source_record: keep_one
    conflicting_same_source_record: fail_closed
    same_moment_different_source_record: preserve_all
    analytical_revision_resolution: separate_derived_layer_required
identity_policy:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - source_id
    - secid
    - board
    - market
    - engine
  source_id_is_instrument_specific: false
  source_id_scope: shared_by_algopack_futoi_source
  ticker_must_be_explicit_registry_binding: true
failure_semantics:
  unauthorized_after_retry: fail_closed
  empty_response: fail_closed
  error_message_payload: fail_closed
  schema_mismatch: fail_closed
  duplicate_case_normalized_source_column: fail_closed
  invalid_raw_tradedate_or_tradetime: fail_closed
  raw_row_outside_explicit_trade_date: fail_closed
  raw_ticker_identity_mismatch: fail_closed
  missing_or_unsupported_clgroup: fail_closed
  missing_or_invalid_systime: fail_closed
  missing_or_invalid_source_identifier: fail_closed
  source_reference_date_mismatch: fail_closed
  publication_before_source_reference_time: fail_closed
  conflicting_same_source_record: fail_closed
  implicit_ticker_fallback: forbidden
  public_iss_fallback: forbidden
evidence:
  repository_materializer_ref: src/moex_data/futures/materialize_futoi_instrument.py
  repository_backfill_ref: src/moex_data/futures/backfill_futoi_instrument.py
  registry_evidence_ref: configs/instruments/forts_instrument_registry.v1.yaml
  server_revalidation_date: "2026-08-18"
  server_revalidation_status: proven
  public_iss_evidence_status: invalidated
  public_iss_invalidation_reason: futoi_block_returned_ERROR_MESSAGE_not_data
  official_metric_semantics_reference: https://moexalgo.github.io/docs/description/futoi
  historical_timestamp_revalidation:
    trade_date: "2021-04-06"
    observed_common_systime: "2025-06-21 16:22:46"
    observed_distinct_moment_and_seqnum_records: true
    conclusion: systime_not_usable_as_historical_raw_event_identity
  proven_tickers:
    - usdrubf
    - cnyrubf
    - si
    - cr
  pilot_trade_date: "2026-08-17"
  pilot_quality_status: pass
  source_coverage:
    si:
      first_available: "2020-01-03"
      last_available: "2026-08-17"
    cr:
      first_available: "2022-04-21"
      last_available: "2026-08-17"
    usdrubf:
      first_available: "2022-12-30"
      last_available: "2026-08-17"
    cnyrubf:
      first_available: "2022-12-30"
      last_available: "2026-08-17"
  validated_materialized_history:
    si:
      first_materialized: "2020-01-03"
      last_materialized: "2026-08-17"
      partition_count: 1757
      row_count: 597650
      skipped_empty_source_dates: 662
      physical_audit_status: pass
