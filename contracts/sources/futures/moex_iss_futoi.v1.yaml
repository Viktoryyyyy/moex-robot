contract_id: moex_iss_futoi.v1
schema_version: source_contract.v1
status: active_stage2
source_id: moex_iss_futoi
source_system: moex_iss
source_kind: supplementary_futoi
engine: futures
market: forts
board: RFUD
endpoint_id: moex_futoi
endpoint_pattern: /iss/analyticalproducts/futoi/securities/{TICKER}.json
base_url_env: MOEX_ISS_BASE_URL
default_base_url: https://iss.moex.com
auth:
  type: public_iss
request_contract:
  explicit_fields:
    from: "{YYYY-MM-DD}"
    till: "{YYYY-MM-DD}"
  response_block: data
  latest_autodetect_allowed: false
  fallback_endpoint_allowed: false
response_contract:
  canonical_dataset_ref: contracts/datasets/futures_futoi_raw.v1.yaml
  availability_report_ref: contracts/datasets/futures_futoi_availability_report_contract.md
identity_policy:
  canonical_identity_field: instrument_id
  source_identity_fields:
    - source_id
    - secid
    - board
    - market
    - engine
  source_id_is_instrument_specific: false
  source_id_scope: shared_by_futoi_source
  ticker_must_be_explicit_registry_binding: true
failure_semantics:
  empty_response: fail_closed
  schema_mismatch: fail_closed
  implicit_ticker_fallback: forbidden
evidence:
  repository_endpoint_config_ref: configs/datasets/futures_algopack_availability_sources_config.json
  repository_exact_fetch_ref: src/moex_data/futures/all_universe_futoi_raw_backfill_slice.py
  server_probe_date: 2026-08-18
  server_probe_status: available
  proven_tickers:
    - usdrubf
    - cnyrubf
    - si
    - cr
