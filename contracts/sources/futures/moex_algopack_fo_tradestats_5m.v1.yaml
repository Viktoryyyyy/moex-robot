    requested_from: "2020-01-01"
    requested_till: "2026-08-17"
    identity_filter: SECID+TRADEDATE
    transport: authenticated_apim
    ranges:
      USDRUBF:
        first_available: "2022-04-26"
        last_available: "2026-08-17"
      CNYRUBF:
        first_available: "2022-04-26"
        last_available: "2026-08-17"
      SiU6:
        first_available: "2024-09-18"
        last_available: "2026-08-17"
      CRU6:
        first_available: "2025-03-07"
        last_available: "2026-08-17"
  stage2_quote_roles:
