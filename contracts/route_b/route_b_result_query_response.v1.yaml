schema_version: route_b_result_query_response.v1
contract_id: ROUTE_B_RESULT_QUERY_RESPONSE_V1
project: MOEX Bot
status: active
purpose: Full evidence response for PM L2 review and verdict preparation.
required_fields:
  - schema_version
  - workflow_run_id
  - idempotency_key
  - repository_full_name
  - status
  - current_state
  - current_phase
  - pm_l3_package
  - github_execution_result
  - pr_validation_package
  - pm_l3_return_package
  - evidence_refs
  - pr_refs
  - ci_refs
  - changed_file_refs
  - blockers
  - required_fixes
  - pm_l2_review_required
  - authority_boundary
  - events_summary
  - steps_summary
evidence_section_rules:
  status_only_response_allowed: false
  missing_sections_must_be_explicit_null: true
  missing_sections_require_blocker_note: true
  required_evidence_sections:
    - pm_l3_package
    - github_execution_result
    - pr_validation_package
    - pm_l3_return_package
authority_boundary:
  pm_l2_final_verdict_authority: true
  pm_l2_merge_approval_authority: true
  pm_l3_validation_return_only: true
  subchat_return_to_role: PM_L3_DELIVERY_VALIDATION_OWNER
  merge_performed_by_executor: false
  n8n_merge_allowed: false
  direct_main_write_allowed: false
  force_push_allowed: false
  file_delete_allowed: false
  approved_for_merge: false
  ci_passed_is_merge_approval: false
pm_l2_review:
  pm_l2_review_required: true
  status_only_package_is_not_pm_l2_verdict_package: true
ci_boundary:
  ci_passed_does_not_imply_approved_for_merge: true
rejection_rules:
  reject_status_only_pm_l2_verdict_package: true
  reject_silent_evidence_omission: true
  reject_pm_l2_review_required_false: true
  reject_merge_performed_by_executor: true
  reject_n8n_merge: true
  reject_direct_main_write: true
  reject_force_push: true
  reject_file_delete: true
  reject_ci_passed_as_merge_approval: true
