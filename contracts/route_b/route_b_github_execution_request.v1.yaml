schema_version: route_b_github_execution_request.v1
contract_id: ROUTE_B_GITHUB_EXECUTION_REQUEST_V1
project: MOEX Bot
status: active
required_fields:
  - schema_version
  - workflow_run_id
  - request_id
  - repository_full_name
  - base_branch
  - base_sha
  - route_b_context_registry_ref
  - pm_l2_request_ref
  - pm_l3_package_ref
  - execution_scope
  - branch_plan
  - pr_plan
  - validation_requirements
  - governance_flags
  - rejection_rules
route_b_context_registry_ref:
  path: docs/sot/context/registry.route_b.v1.yaml
  source_of_truth: github_repo
pm_payload_contract:
  role_context_ref: required
  target_role_context_ref: forbidden
branch_plan:
  branch_prefix: n8n/
  rejected_branch_prefix: route-b/
  branch_name_pattern: n8n/<workflow_run_id>-<short_request_id>
pr_plan:
  base_branch: main
  pr_required: true
validation_requirements:
  github_actions_workflow: tests
  pm_l3_validation_package_required: true
  pm_l2_review_required: true
governance_flags:
  direct_main_write_allowed: false
  n8n_merge_allowed: false
  force_push_allowed: false
  file_delete_allowed: false
  production_runtime_allowed: false
rejection_rules:
  forbidden_dynamic_markers:
    - latest
    - current
    - autodetect
  reject_target_role_context_ref: true
  reject_missing_role_context_ref: true
  reject_non_n8n_branch_prefix: true
  reject_direct_main_write: true
  reject_n8n_merge: true
  reject_force_push: true
  reject_file_delete: true
  reject_runtime_or_broker_scope: true
