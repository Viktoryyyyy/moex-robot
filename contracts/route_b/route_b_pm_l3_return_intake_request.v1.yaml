schema_version: route_b_pm_l3_return_intake_request.v1
contract_id: ROUTE_B_PM_L3_RETURN_INTAKE_REQUEST_V1
project: MOEX Bot
status: active
purpose: PM L3 returns validation and evidence to PM L2 after sub-chat, PR, CI, or blocker validation.
required_fields:
  - schema_version
  - workflow_run_id
  - request_id
  - repository_full_name
  - source_role
  - return_to_role
  - return_type
  - pm_l3_validation_report
  - evidence_refs
  - authority_boundary
source_role:
  allowed_value: PM_L3_DELIVERY_VALIDATION_OWNER
return_to_role:
  allowed_value: PM_L2_PHASE_OWNER
return_type:
  allowed_values:
    - pm_l3_after_subchat_validation
    - pm_l3_after_github_pr_validation
    - pm_l3_blocker_return
authority_boundary:
  pm_l2_final_verdict_authority: true
  pm_l2_merge_approval_authority: true
  pm_l3_validation_return_only: true
  subchat_return_to_role: PM_L3_DELIVERY_VALIDATION_OWNER
  merge_performed_by_executor: false
  n8n_merge_allowed: false
  direct_main_write_allowed: false
  force_push_allowed: false
  file_delete_allowed: false
  approved_for_merge: false
  ci_passed_is_merge_approval: false
rejection_rules:
  reject_missing_workflow_run_id: true
  reject_missing_repository_full_name: true
  reject_source_role_not_pm_l3: true
  reject_return_to_role_not_pm_l2: true
  reject_subchat_direct_to_pm_l2: true
  reject_pm_l3_claiming_pm_l2_approval: true
  reject_n8n_merge: true
  reject_direct_main_write: true
  reject_force_push: true
  reject_file_delete: true
